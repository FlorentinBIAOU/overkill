<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="round">
  <title>Reconnaître et transcrire</title>
  <!-- L'idée : en haut un signal continu, qui remplit sa bande sans qu'on
       sache où une chose finit et où la suivante commence. En bas la même
       étendue devenue des unités égales, séparées, dénombrables : du texte,
       c'est-à-dire des morceaux qu'on peut compter et désigner. -->

  <rect x="112" y="96" width="64" height="248" fill="#8A7C5C" stroke="none"/>
  <rect x="192" y="208" width="64" height="136" fill="currentColor" stroke="none"/>
  <path d="M280 56V344" stroke-dasharray="0 32"/>
  <rect x="304" y="184" width="64" height="160" fill="#FFCE00" stroke="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="round">
  <title>Prédire</title>
  <!-- L'idée : le relevé s'arrête à une frontière en pointillé. Au-delà, la
       colonne jaune n'a jamais été mesurée : elle est estimée, et elle
       continue la pente des deux colonnes ordinaires. Entre elles, une
       troisième monte au double : celle-là ne suit rien, elle cloche. -->

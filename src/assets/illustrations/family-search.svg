<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="round">
  <title>Chercher</title>
  <!-- L'idee : avant de chercher, tout se ressemble et rien ne ressort.
       Chercher, c'est ce qui reste une fois le reste ecarte : deux choses
       passees de l'autre cote, et devenues les seules qu'on regarde. -->

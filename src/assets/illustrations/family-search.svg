    <circle cx="64" cy="128" r="24"/><circle cx="136" cy="128" r="24"/><circle cx="208" cy="128" r="24"/>
    <circle cx="64" cy="200" r="24"/><circle cx="136" cy="200" r="24"/><circle cx="208" cy="200" r="24"/>
    <circle cx="64" cy="272" r="24"/><circle cx="136" cy="272" r="24"/><circle cx="208" cy="272" r="24"/>
  </g>
  <path d="M256 96v208"/>
  <g fill="#FFCE00" stroke="none">
    <circle cx="320" cy="152" r="40"/><circle cx="320" cy="248" r="40"/>
  </g>
</svg>

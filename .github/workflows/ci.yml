# Intégration continue (CDC 11.2).
#
# La chaîne n'est pas décrite ici : elle est décrite une seule fois, dans
# package.json, et ce fichier l'appelle en deux étapes.
#
#   npm run check:fast   une vingtaine de secondes, aucun navigateur : schéma
#                        des fiches, suites unitaires, système de design,
#                        français, construction, liens, référencement, poids
#   npm run check:slow   quelques minutes : exécution des 148 extraits,
#                        contrôles dans un vrai navigateur, gabarits,
#                        accessibilité, débordements et cibles tactiles,
#                        composants interactifs, puis la même chaîne de
#                        recherche et de filtres sur deux cents fiches
#
# Les six contrôles contractuels de la section 11.2 sont dedans, dans l'ordre
# imposé. Ils l'étaient déjà, mais cette liste d'étapes avait divergé de la
# chaîne locale : elle ne lançait ni check-seo, ni les suites de la zone
# d'essai, du questionnaire et du catalogue. Une chaîne décrite à deux endroits
# finit par différer ; `check-chain` vérifie désormais qu'aucun contrôle ne
# reste orphelin.
#
# Un échec reste lisible : chaque étape de la chaîne annonce son nom avant de
# s'exécuter.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version exacte, la même que .nvmrc, que suit la machine de travail. « 22 »
  # suivait la dernière Node 22 publiée pendant que la machine restait sur la
  # sienne : un test vert en local échouait ici (voir docs/ci/DIAGNOSTIC-CI.md).
  # Monter de version, c'est changer les deux fichiers dans le même commit.
  NODE_VERSION: '22.23.2'
  PYTHON_VERSION: '3.13'

jobs:
  verifier:
    name: Contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: content/snippets/requirements-snippets.txt

      - name: Installer les dépendances Node
        run: npm ci

      - name: Installer les dépendances Python des extraits
        run: |
          python -m venv .venv-tools
          .venv-tools/bin/pip install --upgrade pip
          .venv-tools/bin/pip install -r content/snippets/requirements-snippets.txt

      - name: Installer le dictionnaire français
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell-fr-classical
          .venv-tools/bin/pip install spylls

      - name: Installer le navigateur des contrôles
        run: npx playwright install --with-deps chromium

      # --- La chaîne, en deux passes -------------------------------------
      #
      # Le jeu de test à deux cents fiches est dérivé de la feuille de route et
      # n'est jamais commité : la passe longue le régénère elle-même.

      - name: Passe rapide — schéma, unitaires, design, construction, poids
        run: npm run check:fast

      - name: Passe longue — extraits, navigateur, gabarits, deux cents fiches
        run: npm run check:slow

      - name: Liens externes, en avertissement
        continue-on-error: true
        run: npm run check:links:external

  title:
    fr: "Rapprocher une facture de son bon de commande"
    en: "Check an invoice against its purchase order"
  need:
    fr: "Vérifier qu'une facture reçue correspond à ce qui avait été commandé puis livré, ligne par ligne."
    en: "Check that an incoming invoice matches what was ordered and then delivered, line by line."
- id: check-bank-details-before-a-transfer
  family: decide-validate
  title:
    fr: "Contrôler des coordonnées bancaires avant un virement"
    en: "Check bank details before a transfer"
  need:
    fr: "Détecter une erreur de saisie dans un identifiant de compte avant d'engager un paiement."
    en: "Catch a typing error in an account identifier before committing a payment."
- id: check-a-contract-contains-the-required-clauses
  family: decide-validate
  title:
    fr: "Vérifier qu'un contrat contient les clauses attendues"
    en: "Check that a contract contains the required clauses"
  need:
    fr: "Contrôler qu'un document contractuel comporte toutes les clauses obligatoires avant de l'envoyer à la signature."
    en: "Check that a contract document carries every required clause before sending it for signature."
- id: check-a-postal-address-is-deliverable
  family: decide-validate
  title:
    fr: "Vérifier qu'une adresse postale est livrable"
    en: "Check that a postal address is deliverable"
  need:
    fr: "S'assurer qu'une adresse saisie existe et peut recevoir un colis, avant de lancer une expédition."
    en: "Make sure a typed address exists and can receive a parcel, before starting a shipment."
- id: check-that-a-translation-file-is-complete
  family: decide-validate
  title:
    fr: "Vérifier qu'un fichier de traduction est complet"
    en: "Check that a translation file is complete"
  need:
    fr: "Repérer les clés manquantes, les variables oubliées et les textes non traduits avant de publier une nouvelle langue."
    en: "Find missing keys, forgotten variables and untranslated strings before shipping a new language."
- id: decide-when-to-retry-a-failed-operation
  family: decide-validate
  title:
    fr: "Arbitrer entre réessayer et abandonner un traitement"
    en: "Decide when to retry a failed operation"
  need:
    fr: "Choisir si une opération échouée doit être relancée, mise de côté ou signalée, selon la nature de l'erreur."
    en: "Choose whether a failed operation should be retried, set aside or reported, depending on the error."
- id: decide-whether-a-change-needs-human-review
  family: decide-validate
  title:
    fr: "Décider si une modification doit être relue"
    en: "Decide whether a change needs human review"
  need:
    fr: "Envoyer en relecture humaine les seules modifications qui le méritent, et laisser passer les autres automatiquement."
    en: "Send for human review only the changes that deserve it, and let the rest through automatically."
- id: detect-conflicts-in-a-schedule
  family: decide-validate
  title:
    fr: "Repérer les conflits dans un planning"
    en: "Detect conflicts in a schedule"
  need:
    fr: "Trouver les chevauchements, les ressources réservées deux fois et les créneaux impossibles dans un planning."
    en: "Find overlaps, double-booked resources and impossible slots in a schedule."
- id: reconcile-a-bank-statement-with-a-ledger
  family: decide-validate
  title:
    fr: "Rapprocher un relevé bancaire d'un journal comptable"
    en: "Reconcile a bank statement with a ledger"
  need:
    fr: "Faire correspondre des opérations bancaires et des écritures comptables, et isoler celles qui ne tombent pas juste."
    en: "Match bank operations with accounting entries and isolate the ones that do not line up."
- id: validate-a-form-server-side
  family: decide-validate
  title:
    fr: "Valider un formulaire côté serveur"
    en: "Validate a form server-side"
  need:
    fr: "Vérifier que les données reçues d'un formulaire sont complètes et cohérentes avant de les enregistrer."
    en: "Check that the data received from a form is complete and coherent before storing it."
- id: validate-a-phone-number-and-its-country-code
  family: decide-validate
  title:
    fr: "Vérifier un numéro de téléphone et son indicatif"
    en: "Validate a phone number and its country code"
  need:
    fr: "Contrôler qu'un numéro saisi est valide dans le pays annoncé et le ramener à une forme unique."
    en: "Check that a typed number is valid in the stated country and bring it to a single form."
- id: validate-an-api-payload-against-its-contract
  family: decide-validate
  title:
    fr: "Valider une requête d'API contre son contrat"
    en: "Validate an API payload against its contract"
  need:
    fr: "Rejeter proprement une requête entrante qui ne respecte pas le contrat publié, avec un message exploitable."
    en: "Cleanly reject an incoming request that breaks the published contract, with a usable message."
- id: validate-an-email-address-without-sending-a-message
  family: decide-validate
  title:
    fr: "Vérifier une adresse email sans envoyer de message"
    en: "Validate an email address without sending a message"
  need:
    fr: "Savoir si une adresse saisie a des chances d'exister avant de lui envoyer quoi que ce soit."
    en: "Work out whether a typed address stands a chance of existing before sending anything to it."
- id: validate-an-imported-file-against-a-schema
  family: decide-validate
  title:
    fr: "Valider un fichier importé contre le format attendu"
    en: "Validate an imported file against its expected schema"
  need:
    fr: "Contrôler colonne par colonne qu'un fichier déposé par un client correspond au format convenu, et dire ce qui cloche."
    en: "Check column by column that a customer-supplied file matches the agreed format, and say what is wrong."

# Feuille de route — les 200 intitulés de fiches (CDC 6.2).
#
# Ce ne sont pas des fiches. Aucun contenu de barreau n'est produit pour eux
# (interdit 7). Ils servent à trois choses : montrer l'ampleur du catalogue
# visé, vérifier que l'architecture tient à 200 entrées, et donner aux
# contributeurs une liste dans laquelle se servir.
#
# Vingt intitulés par famille, sur les dix familles. Les 25 fiches du contenu
# de lancement en font partie.
#
# Règles de rédaction : docs/sprints/CHARTE-ROADMAP.md

# --------------------------------------------------------------------------
# Détecter et filtrer
# --------------------------------------------------------------------------

- id: block-abusive-login-attempts
  family: detect-filter
  title:
    fr: "Bloquer les tentatives de connexion abusives"
    en: "Block abusive login attempts"
  need:
    fr: "Repérer les vagues d'essais de mots de passe sur un formulaire de connexion sans gêner les utilisateurs distraits."
    en: "Spot waves of password guessing against a login form without punishing forgetful users."
- id: blur-faces-in-photos
  family: detect-filter
  title:
    fr: "Flouter les visages sur des photos"
    en: "Blur faces in photos"
  need:
    fr: "Masquer le visage des personnes présentes sur une image avant de la publier ou de la transmettre."
    en: "Hide the faces of the people caught in an image before publishing or sharing it."
- id: detect-copied-text-between-documents
  family: detect-filter
  title:
    fr: "Repérer un texte copié d'un document à l'autre"
    en: "Detect text copied between documents"
  need:
    fr: "Retrouver les passages repris d'un document dans un autre, y compris quand quelques mots ont été changés."
    en: "Find passages reused from one document in another, even when a few words were changed."
- id: filter-out-bot-traffic-from-logs
  family: detect-filter
  title:
    fr: "Écarter le trafic des robots dans les journaux"
    en: "Filter bot traffic out of server logs"
  need:
    fr: "Distinguer les visites humaines des passages d'automates pour que les statistiques d'audience veuillent dire quelque chose."
    en: "Separate human visits from automated crawls so that traffic figures mean something."
- id: filter-noisy-alerts-before-paging
  family: detect-filter
  title:
    fr: "Filtrer les alertes inutiles avant de réveiller quelqu'un"
    en: "Filter noisy alerts before paging someone"
  need:
    fr: "Regrouper et écarter les alertes répétitives ou sans conséquence pour ne notifier une astreinte que sur un incident réel."
    en: "Group and drop repetitive or harmless alerts so on-call is woken only for a real incident."
- id: detect-secrets-in-source-code
  family: detect-filter
  title:
    fr: "Repérer les identifiants oubliés dans du code"
    en: "Find credentials left in source code"
  need:
    fr: "Trouver les clés d'accès, mots de passe et jetons laissés dans un dépôt avant qu'ils ne soient publiés."
    en: "Find the access keys, passwords and tokens left in a repository before they get published."
- id: find-duplicate-records
  family: detect-filter
  title:
    fr: "Repérer les doublons dans une base clients"
    en: "Find duplicate records in a customer database"
  need:
    fr: "Retrouver les fiches qui désignent la même personne malgré des orthographes, des abréviations ou des champs manquants."
    en: "Find the records that describe the same person despite different spellings, abbreviations or missing fields."
- id: find-personal-data-in-a-spreadsheet
  family: detect-filter
  title:
    fr: "Repérer les données personnelles dans un tableur"
    en: "Find personal data in a spreadsheet"
  need:
    fr: "Savoir quelles colonnes d'un fichier contiennent des données personnelles avant de le partager ou de l'archiver."
    en: "Know which columns of a file hold personal data before sharing or archiving it."
- id: find-duplicate-images-in-a-media-library
  family: detect-filter
  title:
    fr: "Repérer deux fois la même image dans une médiathèque"
    en: "Find the same image twice in a media library"
  need:
    fr: "Retrouver les visuels identiques, ou simplement recadrés, redimensionnés ou recompressés, qui encombrent une bibliothèque."
    en: "Find visuals that are identical, or merely cropped, resized or recompressed, cluttering a library."
- id: mask-personal-data-in-chat
  family: detect-filter
  title:
    fr: "Masquer les coordonnées dans un message"
    en: "Mask personal details in a message"
  need:
    fr: "Remplacer les numéros de téléphone, e-mails et adresses d'un message avant de l'afficher, de le stocker ou de le transmettre ailleurs."
    en: "Replace the phone numbers, emails and addresses in a message before displaying, storing or forwarding it."
- id: moderate-user-comments
  family: detect-filter
  title:
    fr: "Modérer des commentaires publics"
    en: "Moderate public comments"
  need:
    fr: "Écarter les commentaires insultants ou haineux avant leur publication, sans faire taire les critiques légitimes."
    en: "Keep insulting or hateful comments off a public page without silencing legitimate criticism."
- id: screen-uploaded-files-for-malware
  family: detect-filter
  title:
    fr: "Contrôler les fichiers déposés par les utilisateurs"
    en: "Screen the files users upload"
  need:
    fr: "Vérifier qu'un fichier reçu est bien du type annoncé et ne transporte rien de dangereux avant de le stocker."
    en: "Check that an uploaded file really is what it claims to be and carries nothing harmful."
- id: detect-fraudulent-payment-attempts
  family: detect-filter
  title:
    fr: "Repérer une tentative de paiement frauduleuse"
    en: "Spot a fraudulent payment attempt"
  need:
    fr: "Signaler les commandes suspectes au moment du paiement sans faire échouer les achats légitimes."
    en: "Flag suspicious orders at checkout without turning away legitimate buyers."
- id: detect-nudity-in-uploaded-images
  family: detect-filter
  title:
    fr: "Repérer les images explicites envoyées par les utilisateurs"
    en: "Spot explicit images among user uploads"
  need:
    fr: "Écarter les photos à caractère sexuel déposées par les utilisateurs avant qu'elles n'apparaissent sur le site."
    en: "Keep sexually explicit uploads from ever appearing on a public site."
- id: detect-fake-reviews
  family: detect-filter
  title:
    fr: "Repérer les faux avis"
    en: "Spot fake reviews"
  need:
    fr: "Signaler les avis rédigés en série ou achetés avant qu'ils ne faussent la note affichée d'un produit."
    en: "Flag mass-produced or paid-for reviews before they distort the rating shown for a product."
- id: detect-profanity-in-usernames
  family: detect-filter
  title:
    fr: "Repérer les insultes dans les pseudonymes"
    en: "Spot profanity in usernames"
  need:
    fr: "Refuser les pseudonymes grossiers, y compris quand ils sont écrits avec des chiffres ou des caractères détournés."
    en: "Reject crude usernames, including the ones disguised with digits or lookalike characters."
- id: detect-scam-links-in-messages
  family: detect-filter
  title:
    fr: "Repérer les liens frauduleux dans les messages"
    en: "Spot scam links in messages"
  need:
    fr: "Détecter les liens de hameçonnage ou de redirection douteuse postés par les utilisateurs avant qu'un lecteur ne clique."
    en: "Catch phishing or shady redirect links posted by users before a reader clicks one."
- id: detect-spam-in-contact-form
  family: detect-filter
  title:
    fr: "Repérer le spam dans un formulaire de contact"
    en: "Spot spam in a contact form"
  need:
    fr: "Écarter les envois automatiques et publicitaires reçus par un formulaire public sans bloquer les vraies demandes."
    en: "Keep automated and promotional submissions out of a public form without blocking genuine enquiries."
- id: detect-ai-generated-text
  family: detect-filter
  title:
    fr: "Repérer un texte écrit par une machine"
    en: "Tell whether a text was machine-written"
  need:
    fr: "Estimer si un texte reçu a été rédigé par un modèle de langue, et savoir ce que vaut cette estimation."
    en: "Estimate whether a submitted text was written by a language model, and how much that estimate is worth."
- id: block-disposable-email-addresses
  family: detect-filter
  title:
    fr: "Écarter les adresses e-mail jetables"
    en: "Turn away disposable email addresses"
  need:
    fr: "Refuser à l'inscription les adresses temporaires qui rendront le compte injoignable quelques heures plus tard."
    en: "Refuse throwaway addresses at sign-up, since the account becomes unreachable within hours."

# --------------------------------------------------------------------------
# Extraire
# --------------------------------------------------------------------------

- id: extract-contact-details-from-a-web-page
  family: extract
  title:
    fr: "Récupérer les coordonnées affichées sur une page"
    en: "Collect the contact details listed on a page"
  need:
    fr: "Rassembler les téléphones, e-mails et adresses présents sur une page web pour alimenter une fiche."
    en: "Gather the phones, emails and addresses shown on a web page to fill in a record."
- id: extract-amounts-and-currencies-from-text
  family: extract
  title:
    fr: "Extraire les montants d'un texte"
    en: "Extract amounts and currencies from a text"
  need:
    fr: "Retrouver les sommes citées dans un message ou un document, avec leur devise, quelle que soit leur écriture."
    en: "Find the sums quoted in a message or a document, with their currency, however they are written."
- id: extract-dates-from-text
  family: extract
  title:
    fr: "Extraire des dates d'un texte libre"
    en: "Extract dates from free text"
  need:
    fr: "Retrouver les dates mentionnées dans un message ou un document, quel que soit leur format."
    en: "Find the dates mentioned in a message or a document, whatever their format."
- id: extract-measurements-from-a-product-description
  family: extract
  title:
    fr: "Extraire les mesures d'une description produit"
    en: "Extract measurements from a product description"
  need:
    fr: "Retrouver les dimensions, poids et volumes cités dans un texte libre et les ramener à une unité commune."
    en: "Find the dimensions, weights and volumes quoted in free text and bring them to a common unit."
- id: extract-opening-hours-from-a-business-page
  family: extract
  title:
    fr: "Extraire les horaires d'ouverture d'un établissement"
    en: "Extract opening hours from a business page"
  need:
    fr: "Transformer des horaires écrits en toutes lettres en créneaux qu'un programme peut comparer à l'heure courante."
    en: "Turn opening hours written in plain words into slots a program can compare against the clock."
- id: extract-structured-data-from-a-resume
  family: extract
  title:
    fr: "Extraire les informations d'un CV"
    en: "Extract the details held in a CV"
  need:
    fr: "Récupérer les coordonnées, les expériences, les formations et les compétences d'une candidature reçue en fichier."
    en: "Recover the contact details, jobs, studies and skills from an application received as a file."
- id: extract-fields-from-invoice
  family: extract
  title:
    fr: "Extraire les champs d'une facture"
    en: "Extract the fields of an invoice"
  need:
    fr: "Récupérer le numéro, la date, le montant et le fournisseur d'une facture, quelle que soit sa mise en page."
    en: "Pull the number, date, total and supplier out of an invoice, whatever its layout."
- id: extract-ingredients-and-steps-from-a-recipe
  family: extract
  title:
    fr: "Extraire les ingrédients et les étapes d'une recette"
    en: "Extract the ingredients and steps of a recipe"
  need:
    fr: "Séparer la liste des ingrédients, avec leurs quantités, de la suite des étapes de préparation."
    en: "Separate the ingredient list, with its quantities, from the sequence of preparation steps."
- id: extract-key-clauses-from-a-contract
  family: extract
  title:
    fr: "Extraire les clauses clés d'un contrat"
    en: "Extract the key clauses of a contract"
  need:
    fr: "Retrouver dans un contrat la durée, les échéances, le préavis et les conditions de résiliation."
    en: "Locate the term, the deadlines, the notice period and the termination conditions inside a contract."
- id: extract-key-terms-from-a-document
  family: extract
  title:
    fr: "Extraire les mots-clés d'un document"
    en: "Extract the key terms of a document"
  need:
    fr: "Dégager les termes qui caractérisent un document, pour l'indexer, l'étiqueter ou en donner un aperçu."
    en: "Surface the terms that characterise a document, so it can be indexed, labelled or previewed."
- id: extract-tables-from-a-pdf
  family: extract
  title:
    fr: "Extraire les tableaux d'un PDF"
    en: "Extract the tables from a PDF"
  need:
    fr: "Récupérer sous forme de lignes et de colonnes les tableaux d'un document conçu pour l'impression."
    en: "Recover, as rows and columns, the tables inside a document laid out for print."
- id: extract-links-from-a-page
  family: extract
  title:
    fr: "Récupérer les liens d'une page"
    en: "Collect the links of a page"
  need:
    fr: "Lister les adresses citées dans une page ou un message, ramenées à des adresses absolues."
    en: "List the addresses quoted in a page or a message, resolved to absolute ones."
- id: extract-metadata-from-a-file
  family: extract
  title:
    fr: "Lire les métadonnées d'un fichier"
    en: "Read a file's metadata"
  need:
    fr: "Obtenir la date, l'auteur, les dimensions ou la position qu'un fichier transporte, avant de le publier ou de l'archiver."
    en: "Get the date, the author, the dimensions or the position a file carries, before publishing or filing it."
- id: extract-people-and-companies-from-an-article
  family: extract
  title:
    fr: "Repérer les personnes et organisations citées dans un article"
    en: "Find the people and organisations named in an article"
  need:
    fr: "Lister les noms propres mentionnés dans un texte et savoir à quel type d'entité chacun correspond."
    en: "List the proper names mentioned in a text and tell what kind of entity each one is."
- id: extract-the-latest-reply-from-an-email-thread
  family: extract
  title:
    fr: "Isoler la dernière réponse d'un fil d'e-mails"
    en: "Isolate the newest reply in an email thread"
  need:
    fr: "Séparer le message qui vient d'arriver de l'historique recopié en dessous."
    en: "Separate the message that just arrived from the history copied under it."
- id: extract-product-data-from-a-shop-page
  family: extract
  title:
    fr: "Récupérer les données produit d'une page marchande"
    en: "Pull product data from a shop page"
  need:
    fr: "Relever le nom, le prix, la disponibilité et les visuels d'un produit affiché sur un site marchand."
    en: "Read the name, price, availability and images of a product shown on a shop site."
- id: extract-quotes-from-an-interview-transcript
  family: extract
  title:
    fr: "Extraire les citations d'un entretien"
    en: "Pull quotes from an interview transcript"
  need:
    fr: "Retrouver dans une transcription les passages prononcés par chaque intervenant et utilisables tels quels."
    en: "Find, in a transcript, the passages each speaker said that stand up as quotes."
- id: extract-main-content-from-a-web-page
  family: extract
  title:
    fr: "Isoler le contenu principal d'une page web"
    en: "Pull the main content out of a web page"
  need:
    fr: "Récupérer le texte de l'article sans les menus, bandeaux et encarts qui l'entourent."
    en: "Recover the article text without the menus, banners and side panels around it."
- id: split-bibliography-into-references
  family: extract
  title:
    fr: "Découper une bibliographie en références"
    en: "Split a bibliography into references"
  need:
    fr: "Séparer une liste de références et retrouver l'auteur, le titre, l'année et la source de chacune."
    en: "Split a reference list and recover the author, title, year and source of each entry."
- id: parse-address-into-fields
  family: extract
  title:
    fr: "Découper une adresse postale"
    en: "Split a postal address into fields"
  need:
    fr: "Séparer la rue, le code postal, la ville et le pays d'une adresse saisie sur une seule ligne."
    en: "Separate street, postcode, town and country from an address typed on a single line."
- id: extract-fields-from-a-log-line
  family: extract
  title:
    fr: "Découper des lignes de journal en champs"
    en: "Split log lines into fields"
  need:
    fr: "Transformer des lignes de journal hétérogènes en champs nommés pour pouvoir les filtrer et les compter."
    en: "Turn heterogeneous log lines into named fields so they can be filtered and counted."
- id: extract-a-table-from-a-web-page
  family: extract
  title:
    fr: "Transformer un tableau HTML en données"
    en: "Turn an HTML table into data"
  need:
    fr: "Récupérer les lignes et les colonnes d'un tableau publié dans une page web, cellules fusionnées comprises."
    en: "Get the rows and the columns of a table published in a web page, merged cells included."
- id: extract-tracking-numbers-from-an-email
  family: extract
  title:
    fr: "Repérer un numéro de suivi dans un e-mail"
    en: "Spot a tracking number in an email"
  need:
    fr: "Retrouver la référence de colis dans une confirmation d'expédition et savoir de quel transporteur elle relève."
    en: "Find the parcel reference in a shipping confirmation and tell which carrier it belongs to."

# --------------------------------------------------------------------------
# Classer et router
# --------------------------------------------------------------------------

- id: assign-expenses-to-accounting-categories
  family: classify-route
  title:
    fr: "Affecter des dépenses à des catégories comptables"
    en: "Assign expenses to accounting categories"
  need:
    fr: "Attribuer à chaque ligne de dépense le poste comptable qui convient, à partir de son libellé et de son émetteur."
    en: "Give each expense line the accounting category it belongs to, from its label and its merchant."
- id: classify-a-company-by-its-line-of-business
  family: classify-route
  title:
    fr: "Classer une entreprise par secteur d'activité"
    en: "Classify a company by its line of business"
  need:
    fr: "Rattacher une société à un secteur à partir de son nom, de sa description ou de son site."
    en: "Assign a company to a sector using its name, its description or its website."
- id: detect-language-of-text
  family: classify-route
  title:
    fr: "Détecter la langue d'un texte"
    en: "Detect the language of a text"
  need:
    fr: "Savoir dans quelle langue un message est écrit avant de le traiter ou de l'envoyer au bon interlocuteur."
    en: "Work out which language a message is written in before processing it or passing it to the right person."
- id: dispatch-jobs-to-the-right-processing-queue
  family: classify-route
  title:
    fr: "Répartir des traitements dans la bonne file"
    en: "Dispatch jobs to the right processing queue"
  need:
    fr: "Orienter chaque tâche entrante vers la file adaptée à sa taille et à son urgence, pour éviter les bouchons."
    en: "Send each incoming job to the queue that suits its size and urgency, to avoid pile-ups."
- id: gauge-the-sentiment-of-a-customer-review
  family: classify-route
  title:
    fr: "Mesurer le ton d'un avis client"
    en: "Gauge the tone of a customer review"
  need:
    fr: "Savoir si un avis est positif, négatif ou mitigé, pour suivre l'humeur générale et réagir aux plus mauvais."
    en: "Tell whether a review is positive, negative or mixed, to follow overall mood and react to the worst ones."
- id: group-free-text-survey-answers-into-themes
  family: classify-route
  title:
    fr: "Regrouper des réponses libres par thème"
    en: "Group free-text survey answers into themes"
  need:
    fr: "Faire ressortir les sujets récurrents d'un lot de réponses ouvertes au lieu de les lire une par une."
    en: "Surface the recurring subjects in a batch of open answers instead of reading them one by one."
- id: identify-the-intent-behind-a-user-message
  family: classify-route
  title:
    fr: "Reconnaître l'intention derrière un message"
    en: "Identify the intent behind a user message"
  need:
    fr: "Comprendre ce que la personne demande — annuler, s'informer, réclamer — pour déclencher la bonne suite."
    en: "Work out what the person wants — cancel, ask, complain — so the right next step can start."
- id: label-audio-clips-by-what-can-be-heard
  family: classify-route
  title:
    fr: "Étiqueter des extraits sonores selon ce qu'on y entend"
    en: "Label audio clips by what can be heard"
  need:
    fr: "Distinguer une alarme, une voix ou un bruit de fond dans un enregistrement pour déclencher la bonne réaction."
    en: "Tell an alarm, a voice and background noise apart in a recording, so the right reaction follows."
- id: label-contract-clauses-by-type
  family: classify-route
  title:
    fr: "Étiqueter les clauses d'un contrat par nature"
    en: "Label contract clauses by type"
  need:
    fr: "Repérer dans un contrat quelles clauses relèvent de la confidentialité, de la résiliation ou de la responsabilité."
    en: "Find which clauses in a contract cover confidentiality, termination or liability."
- id: label-log-lines-by-severity
  family: classify-route
  title:
    fr: "Étiqueter des lignes de journal par gravité"
    en: "Label log lines by severity"
  need:
    fr: "Distinguer ce qui mérite une alerte de ce qui n'est que du bruit, dans un flux de journaux hétérogènes."
    en: "Tell what deserves an alert from what is only noise, in a stream of heterogeneous logs."
- id: map-free-text-to-an-official-code-list
  family: classify-route
  title:
    fr: "Rattacher un libellé libre à une nomenclature officielle"
    en: "Map free text to an official code list"
  need:
    fr: "Faire correspondre une description écrite à la main au code exact d'une nomenclature imposée et volumineuse."
    en: "Match a hand-written description to the exact code of a mandated, very long classification."
- id: put-products-in-the-right-catalogue-category
  family: classify-route
  title:
    fr: "Ranger des produits dans la bonne catégorie"
    en: "Put products in the right catalogue category"
  need:
    fr: "Placer chaque référence dans l'arborescence du catalogue à partir de son nom et de sa description."
    en: "Place each item in the catalogue tree using its name and its description."
- id: recognise-the-type-of-an-uploaded-document
  family: classify-route
  title:
    fr: "Reconnaître le type d'un document déposé"
    en: "Recognise the type of an uploaded document"
  need:
    fr: "Distinguer une facture d'un contrat ou d'un justificatif dès le dépôt, pour l'envoyer dans le bon traitement."
    en: "Tell an invoice from a contract or a receipt as soon as it lands, so it enters the right process."
- id: route-a-request-to-the-smallest-model-that-can-handle-it
  family: classify-route
  title:
    fr: "Envoyer une requête au plus petit modèle qui suffit"
    en: "Route a request to the smallest model that fits"
  need:
    fr: "Décider en amont si une demande relève d'une règle, d'un petit modèle ou d'un gros, avant de la traiter."
    en: "Decide up front whether a request needs a rule, a small model or a large one, before handling it."
- id: route-support-tickets
  family: classify-route
  title:
    fr: "Aiguiller des tickets vers la bonne équipe"
    en: "Route support tickets to the right team"
  need:
    fr: "Envoyer chaque demande entrante à l'équipe qui saura la traiter, sans qu'une personne ait à tout relire."
    en: "Send every incoming request to the team able to handle it, without someone reading the whole queue first."
- id: sort-incoming-email-into-folders
  family: classify-route
  title:
    fr: "Ranger les emails entrants dans des dossiers"
    en: "Sort incoming email into folders"
  need:
    fr: "Classer les messages reçus dans des dossiers utiles plutôt que de laisser une boîte unique déborder."
    en: "File incoming messages into useful folders instead of letting a single inbox overflow."
- id: sort-photos-by-what-they-show
  family: classify-route
  title:
    fr: "Trier des photos selon ce qu'elles montrent"
    en: "Sort photos by what they show"
  need:
    fr: "Classer un lot d'images selon leur contenu pour retrouver ensuite une scène ou un objet précis."
    en: "Organise a batch of images by their content, so a given scene or object can be found later."
- id: spot-urgent-messages-in-a-shared-inbox
  family: classify-route
  title:
    fr: "Repérer les messages urgents dans une boîte partagée"
    en: "Spot urgent messages in a shared inbox"
  need:
    fr: "Faire remonter en tête les messages qui ne peuvent pas attendre, sans passer toute la boîte en revue."
    en: "Bring the messages that cannot wait to the top, without reviewing the whole inbox by hand."
- id: tag-articles-by-topic
  family: classify-route
  title:
    fr: "Étiqueter des articles par thème"
    en: "Tag articles by topic"
  need:
    fr: "Poser une ou plusieurs étiquettes de sujet sur des articles pour les regrouper et les retrouver ensuite."

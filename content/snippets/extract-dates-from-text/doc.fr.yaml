# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Extraire les dates d'un texte : une expression régulière par format, puis une
  vraie vérification calendaire.

  Niveau N0. Déterministe, bibliothèque standard seule.

  L'expression régulière est la moitié facile. Elle trouve des groupes de
  chiffres et ne sait rien d'autre : 31/02/2024 lui correspond parfaitement, et
  29/02/2023 aussi. La seconde moitié est ce qui fait la différence, et elle
  tient en un seul appel, parce que `datetime.date` possède déjà le calendrier —
  la longueur des mois, les années bissextiles, et la règle du siècle qui fait
  de 1900 une année commune.

  Ce que les chiffres ne peuvent pas dire, c'est si 03/04/2024 est un 3 avril
  ou un 4 mars. Le document le dit le plus souvent ailleurs : une de ses dates
  dont le premier champ dépasse douze ne peut être qu'un jour d'abord, et cela
  fixe toutes les autres dates du même document. À défaut, l'appelant connaît
  peut-être la locale de l'expéditeur. À défaut encore, l'extrait s'abstient :
  la date revient sans son jour plutôt qu'avec une supposition qui a la forme
  d'un fait.

n0.js: |
  Extraire les dates d'un texte : une expression régulière par format, puis une
  vraie vérification calendaire.

  Niveau N0. Déterministe, sans dépendance.

  L'expression régulière est la moitié facile. Elle trouve des groupes de
  chiffres et ne sait rien d'autre : 31/02/2024 lui correspond parfaitement, et
  29/02/2023 aussi.

  La seconde moitié est ce qui fait la différence, et en JavaScript elle
  demande de l'attention : `new Date(2024, 1, 31)` n'échoue pas, il glisse
  silencieusement au 2 mars. La seule vérification honnête est de construire la
  date et de relire ses parties.

  Ce que les chiffres ne peuvent pas dire, c'est si 03/04/2024 est un 3 avril
  ou un 4 mars. Le document le dit le plus souvent ailleurs : une de ses dates
  dont le premier champ dépasse douze ne peut être qu'un jour d'abord, et cela
  fixe toutes les autres dates du même document. À défaut, l'appelant connaît
  peut-être la locale de l'expéditeur. À défaut encore, l'extrait s'abstient :
  la date revient sans son jour plutôt qu'avec une supposition qui a la forme
  d'un fait.

n1.py: |
  Lire les dates qu'un motif ne peut pas lire : un analyseur de dates éprouvé.

  Niveau N1. Le niveau N0 énumère les formes qu'il connaît, et une échéance
  relative n'a pas de forme à énumérer : « dans 15 jours » se compte depuis une
  date. C'est ce comptage, dans une trentaine de langues, que fait une
  bibliothèque d'analyse de dates. `dateparser` ici, `chrono-node` en
  JavaScript : locale, gratuite, déterministe, et installée plutôt qu'écrite.

  Il faut lui dire deux choses dont un motif n'avait pas besoin. Quelles langues
  le texte peut employer — un analyseur à qui l'on donne toutes celles qu'il
  connaît lit davantage, et lit davantage de travers. Et depuis quelle date
  compter : `reference` n'a pas de valeur par défaut ici, à dessein, parce que
  la date depuis laquelle compter est celle du document, pas celle de
  l'exécution. « jeudi prochain » dans un courriel reçu il y a trois semaines
  n'est pas jeudi prochain.

  Un extrait qui confie le travail à une bibliothèque hérite de la
  bibliothèque, pas d'une spécification : les deux langages de cette page n'ont
  pas le même analyseur, et ils ne lisent pas les mêmes choses. Sur
  « 3 janv. 2024 », `dateparser` répond le 3 janvier 2025 et `chrono-node` ne
  répond rien, là où le niveau N0 répond le 3 janvier 2024 — c'est pourquoi N0
  reste dessous, et non à côté. Sur « jeudi prochain » ils divergent aussi : le
  14 mars pour l'un, le 21 pour l'autre.

n1.js: |
  Lire les dates qu'un motif ne peut pas lire : un analyseur de dates éprouvé.

  Niveau N1. Le niveau N0 énumère les formes qu'il connaît, et une échéance
  relative n'a pas de forme à énumérer : « dans 15 jours » se compte depuis une
  date. C'est ce comptage, dans plusieurs langues, que fait une bibliothèque
  d'analyse de dates. `chrono-node` ici, `dateparser` en Python : locale,
  gratuite, déterministe, et installée plutôt qu'écrite.

  Il faut lui dire deux choses dont un motif n'avait pas besoin. Quelles langues
  le texte peut employer — `chrono` a un analyseur par langue, et le français ne
  lit rien d'anglais. Et depuis quelle date compter : `reference` n'a pas de
  valeur par défaut ici, à dessein, parce que la date depuis laquelle compter
  est celle du document, pas celle de l'exécution. « jeudi prochain » dans un
  courriel reçu il y a trois semaines n'est pas jeudi prochain.

  Un extrait qui confie le travail à une bibliothèque hérite de la
  bibliothèque, pas d'une spécification : les deux langages de cette page n'ont
  pas le même analyseur, et ils ne lisent pas les mêmes choses. Sur
  « 3 janv. 2024 », `dateparser` répond le 3 janvier 2025 et `chrono-node` ne
  répond rien, là où le niveau N0 répond le 3 janvier 2024 — c'est pourquoi N0
  reste dessous, et non à côté. Sur « jeudi prochain » ils divergent aussi : le
  14 mars pour l'un, le 21 pour l'autre.

n3: |
  Extraire les dates en interrogeant un modèle généraliste.

  Niveau N3. Sa requête demande de résoudre les dates relatives, « jeudi
  prochain » : elle envoie une date de référence avec le texte, et demande
  chaque date sous forme de jour du calendrier. Le niveau N1 résout les mêmes
  tournures sur place et pour rien ; ce niveau ne vaut son prix que sur celles
  qu'un analyseur manque.

  La référence est la date du document, pas le jour de l'exécution : « jeudi
  prochain » dans un courriel reçu il y a trois semaines n'est pas jeudi
  prochain. Elle n'a pas de valeur par défaut ici, à dessein, parce qu'une
  valeur par défaut serait discrètement aujourd'hui, et qu'un arriéré retraité
  un lundi déplacerait toutes les échéances.

  Le plafond sur l'entrée lève au lieu de tronquer : un contrat coupé en deux
  reviendrait avec une liste d'échéances qui a l'air complète. Ce que fait un
  appelant au-dessus du plafond, c'est découper le document en morceaux qui se
  recouvrent et fusionner les réponses ; cet extrait ne le fait pas, à dessein,
  parce qu'il montre un appel.

  Voyez ce que le code doit faire et que N0 ne faisait pas : passer une date de
  référence, parce que rien d'autre n'indique au modèle le jour qu'il est ;
  brider la taille de l'entrée ; réessayer en cas d'échec ; analyser une réponse
  qui n'est que probablement du JSON valide ; et vérifier le calendrier
  lui-même, parce que rien dans la requête n'empêche la réponse de contenir
  2024-02-31. Cette plomberie est le vrai coût du niveau, et c'est la part que
  les tests doivent couvrir, puisque le modèle lui-même n'est pas testable.

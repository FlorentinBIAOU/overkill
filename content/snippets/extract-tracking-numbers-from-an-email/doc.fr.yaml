# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Les références de colis qu'un e-mail porte, et ce que chacune vaut.

  Niveau N0. Un numéro de suivi n'est pas du texte libre : c'est un
  identifiant dont une norme fixe la forme, et la norme internationale — UPU
  S10, employée par tous les opérateurs postaux et donc par Colissimo et
  Chronopost — y met un chiffre de contrôle. Deux lettres, huit chiffres, un
  chiffre de contrôle, deux lettres de pays : le onzième caractère se calcule à
  partir des huit précédents, et un numéro dont un chiffre est faux échoue.
  C'est la différence entre trouver un candidat et identifier une référence.

  Un numéro UPS en porte une aussi. La dix-huitième position d'un numéro « 1Z »
  est une clé calculée sur les quinze caractères qui la précèdent : les lettres
  deviennent des chiffres, les places impaires comptent une fois et les paires
  deux, et la clé est ce qui mène le total à la dizaine suivante. UPS ne publie
  pas ce calcul ; il est écrit ici parce que c'est celui que satisfait l'exemple
  canonique du transporteur — `1Z999AA10123456784`, dont les quinze caractères
  font 96, d'où une clé de 4 — et parce qu'un numéro qui y échoue est rendu
  quand même, avec `checked: false` et sa raison. Rien n'est écarté sur la foi
  d'une règle non publiée ; seul le mot « vérifié » est retenu.

  Dix chiffres nus, en revanche, ne portent aucune clé : c'est la forme d'une
  lettre de transport DHL Express, et c'est aussi celle d'un numéro de
  commande, d'un numéro de client et d'un numéro de téléphone écrit sans
  espaces. Cette famille est déclarée et nommée, mais elle n'est pas cherchée
  si l'appelant ne le demande pas : un niveau qui rend tous les nombres à dix
  chiffres d'un e-mail comme des références de colis est pire qu'un niveau qui
  ne rend rien. Chaque famille a sa propre raison, parce que « il n'y a rien à
  vérifier » et « ce n'est pas vérifié ici » ne disent pas la même chose.

  Ce qui revient dit donc trois choses : ce qui a été trouvé, de quelle famille
  cela relève, et si quelque chose a réellement été vérifié. Un candidat n'est
  jamais rendu comme une identification.

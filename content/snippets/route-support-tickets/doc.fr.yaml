# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Router un ticket de support avec des règles par mots-clés : ordonnées, avec
  une équipe par défaut.

  Niveau N0. Déterministe, bibliothèque standard seule, et chaque décision peut
  être expliquée à celui qui demande pourquoi son ticket a atterri là.

  Deux choses font d'une liste de mots-clés une règle qu'un service de support
  peut vraiment appliquer.

  D'abord, une priorité explicite. Un ticket parle de plusieurs sujets ; que
  deux équipes soient déclenchées par le même ticket est donc le cas normal, pas
  l'exception. L'ordre de RULES y répond une fois pour toutes et par écrit, au
  lieu de laisser trancher la branche qui s'exécute la première.

  Ensuite, une équipe par défaut. Tout ticket doit atterrir quelque part ; celui
  qui ne déclenche rien doit partir dans une file qu'un humain surveille, et non
  tomber par terre.

n1.js: |
  Router un ticket avec TF-IDF et un classifieur linéaire entraîné sur
  l'archive.

  Niveau N1. Les règles par mots-clés du niveau N0 connaissent les mots que
  quelqu'un a imaginés. Celui-ci connaît les mots que le service a réellement
  reçus : il est entraîné sur les tickets auxquels les équipes ont déjà répondu,
  si bien que c'est le vocabulaire des clients qui décide, et non celui de
  l'auteur des règles.

  Écrit à la main plutôt que tiré d'une bibliothèque, parce que TF-IDF et une
  régression softmax font soixante lignes. Le modèle est une table de poids :
  assez petite pour tenir à côté du code, réentraînée le temps que vous lisiez
  ceci, et chaque poids peut être imprimé et discuté quand quelqu'un demande
  pourquoi son ticket a changé de file.

  Ce qu'il garde du niveau N0, délibérément : une équipe par défaut. Un
  classifieur renvoie toujours quelque chose, et sa classe la plus probable sur
  un ticket dont il n'a aucune idée reste une classe. Le plancher de confiance
  est ce qui ramène ce haussement d'épaules dans la file par défaut, au lieu
  d'une mauvaise file.

n1.py: |
  Router un ticket avec TF-IDF et un classifieur linéaire entraîné sur
  l'archive.

  Niveau N1. Les règles par mots-clés du niveau N0 connaissent les mots que
  quelqu'un a imaginés. Celui-ci connaît les mots que le service a réellement
  reçus : il est entraîné sur les tickets auxquels les équipes ont déjà répondu,
  si bien que c'est le vocabulaire des clients qui décide, et non celui de
  l'auteur des règles.

  Ce qu'il garde du niveau N0, délibérément : une équipe par défaut. Un
  classifieur renvoie toujours quelque chose, et sa classe la plus probable sur
  un ticket dont il n'a aucune idée reste une classe. Le plancher de confiance,
  plus bas, est ce qui ramène ce haussement d'épaules dans la file par défaut,
  au lieu d'une mauvaise file.

  Les données d'entraînement sont l'archive exportée : les tickets résolus et
  l'équipe qui a résolu chacun d'eux. Le modèle est une table de poids assez
  petite pour être conservée dans le dépôt, et le réentraîner est une étape de
  l'export nocturne, pas un projet.

n2: |
  Router un ticket d'après les tickets résolus les plus proches, avec un
  encodeur auto-hébergé.

  Niveau N2. Le niveau N1 apprend les mots de l'archive ; un encodeur associe au
  ticket un vecteur qui suit le sens, si bien qu'un client qui écrit « je
  n'arrive plus à entrer dans mon espace » atterrit à côté des tickets archivés
  sur un mot de passe perdu, alors qu'ils n'ont aucun mot en commun.

  Il n'y a pas d'étape d'entraînement ici, et c'est tout l'intérêt du niveau :
  l'index est l'archive elle-même. Une équipe dont le périmètre change est un
  ré-encodage, pas un réentraînement, et les voisins sont montrés à l'agent
  comme la raison du routage — ce que les poids du niveau N1 n'expliquent
  jamais.

  Ce qu'il coûte : un fichier de modèle à livrer et à tenir à jour, un processus
  chaud pour le garder en mémoire, et un routage dont les réponses changent le
  jour où vous changez de version de modèle. L'archive doit alors être
  ré-encodée, et les anciens scores ne sont pas comparables aux nouveaux.

n3: |
  Router un ticket en interrogeant un modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord, et c'est la
  logique de routage la plus courte de la fiche : aucune règle à maintenir,
  aucune archive à étiqueter, et un ticket dans n'importe quelle langue.

  Voyez ce que le code doit faire et que le niveau N0 n'avait pas à faire :
  borner la taille de l'entrée, réessayer quand le fournisseur échoue, analyser
  une réponse qui n'est que probablement du JSON, et refuser une équipe que le
  modèle a inventée. Cette plomberie est le vrai coût de ce niveau, et c'est la
  part que vos tests doivent couvrir, puisque le modèle lui-même n'est pas
  testable.

  Lisez la fin de `route` de près. Un modèle répond des mots, et les mots ne
  sont pas des files. La liste fermée est la seule chose qui sépare une réponse
  assurée d'un ticket posé dans une file que personne ne surveille.

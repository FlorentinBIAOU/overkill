n2: |
  Lire une page scannée avec un moteur de reconnaissance optique auto-hébergé.

  Niveau N2. Quand N0 a répondu « pas de couche de texte », quelque chose doit
  regarder les pixels. Un moteur comme Tesseract fait exactement cela, sur votre
  machine : la page ne la quitte pas, et il n'y a ni clé ni quota.

  Ce que vous tenez à ce niveau n'est pas le moteur, c'est tout ce qui
  l'entoure : la langue que vous lui annoncez, la confiance sous laquelle une
  page part en relecture humaine, le nettoyage d'un texte qui revient coupé en
  lignes, et la réponse à « que fait le code quand le moteur ne dit rien
  d'utilisable ».

n3: |
  Lire une page scannée en remettant l'image à un modèle généraliste
  multimodal.

  Niveau N3. La page part entière, vers un modèle qui rend une transcription.

  Voyez ce que le code doit faire et que N0 n'avait pas à faire : reconnaître le
  format de l'image, plafonner ce qu'il envoie, encoder les octets, réessayer
  après un échec, analyser une réponse qui n'est que probablement du JSON
  valide, et refuser une réponse qu'il ne peut pas employer. Cette plomberie est
  le vrai coût de ce niveau, et c'est la part que les tests doivent couvrir,
  parce que le modèle lui-même n'est pas testable.

  Et voyez ce qu'aucune de ces tuyauteries ne sait faire : dire si la
  transcription est ce que la page dit. Un modèle qui lit est aussi un modèle
  qui écrit.

  L'intérêt est dans la question, pas dans l'extracteur. Quand la réponse est
  non, cette fonction le dit — elle ne rend pas une chaîne vide, qu'un appelant
  lirait comme « la page est blanche ».

  D'où un non qui vient avec l'une de deux suites. Rien n'a été montré du tout :
  la page est une image, et un moteur de reconnaissance est l'étape suivante. Le
  texte est là et ce fichier ne sait pas le décoder — une police qui porte sa

# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Lire la couche de texte que le document porte peut-être déjà, avant de sortir
  un OCR.

  Niveau N0. Bibliothèque standard seule : zlib pour décompresser les flux de la
  page, et une lecture des opérateurs qui y montrent du texte.

  La plupart des « pages scannées » n'ont jamais été scannées. Un PDF produit
  par un logiciel de comptabilité, un traitement de texte ou un pilote
  d'impression en PDF porte son texte à côté de ses instructions de dessin,
  déjà exact, sans étape de reconnaissance et donc sans rien à rater. Poser la
  question d'abord, c'est un appel de fonction, et elle règle tout le besoin dès
  que la réponse est oui.

  L'intérêt est dans la question, pas dans l'extracteur. Quand la réponse est
  non, cette fonction le dit — elle ne rend pas une chaîne vide, qu'un appelant
  lirait comme « la page est blanche ».

  D'où deux façons de dire non, qui appellent deux suites différentes. Rien n'a
  été montré du tout : la page est une image, et un moteur de reconnaissance est
  l'étape suivante. Beaucoup a été montré et rien ne se lit : le texte est là,
  derrière une table de police que ce fichier ne porte pas, et un moteur de
  reconnaissance serait une réponse entièrement fausse — ce document n'a jamais
  été une image.

n0.js: |
  Lire la couche de texte que le document porte peut-être déjà, avant de sortir
  un OCR.

  Niveau N0. Bibliothèque standard seule : node:zlib pour décompresser les flux
  de la page, et une lecture des opérateurs qui y montrent du texte.

  La plupart des « pages scannées » n'ont jamais été scannées. Un PDF produit
  par un logiciel de comptabilité, un traitement de texte ou un pilote

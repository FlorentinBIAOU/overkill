# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Lire la couche de texte que le document porte peut-être déjà, avant de sortir
  un OCR.

  Niveau N0. Bibliothèque standard seule : zlib pour décompresser les flux de la
  page, et une lecture des opérateurs qui y montrent du texte.

  Un PDF produit par un logiciel de comptabilité, un traitement de texte ou un
  pilote d'impression en PDF porte son texte à côté de ses instructions de
  dessin, déjà exact, sans étape de reconnaissance et donc sans rien à rater.
  Poser la question d'abord, c'est un appel de fonction, et elle règle tout le
  besoin dès que la réponse est oui.

  L'intérêt est dans la question, pas dans l'extracteur. Quand la réponse est
  non, cette fonction le dit — elle ne rend pas une chaîne vide, qu'un appelant
  lirait comme « la page est blanche ».

  D'où un non qui vient avec l'une de deux suites. Rien n'a été montré du tout :
  la page est une image, et un moteur de reconnaissance est l'étape suivante. Le
  texte est là et ce fichier ne sait pas le décoder — une police qui porte sa
  propre table, un document chiffré, un autre filtre que Flate : l'étape
  suivante est une bibliothèque PDF complète, et un moteur de reconnaissance
  serait une réponse fausse, puisque ce document n'a jamais été une image.

n0.js: |
  Lire la couche de texte que le document porte peut-être déjà, avant de sortir
  un OCR.

  Niveau N0. Bibliothèque standard seule : node:zlib pour décompresser les flux de la
  page, et une lecture des opérateurs qui y montrent du texte.

  Un PDF produit par un logiciel de comptabilité, un traitement de texte ou un
  pilote d'impression en PDF porte son texte à côté de ses instructions de
  dessin, déjà exact, sans étape de reconnaissance et donc sans rien à rater.
  Poser la question d'abord, c'est un appel de fonction, et elle règle tout le

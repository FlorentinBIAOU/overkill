# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Demander au document s'il porte déjà son texte, avant de sortir un OCR.

  Niveau N0. Une question, posée à une bibliothèque PDF, et une réponse dont
  l'appelant peut faire quelque chose.

  Un PDF produit par un logiciel de comptabilité, un traitement de texte ou un
  pilote d'impression en PDF porte son texte à côté de ses instructions de
  dessin, déjà exact, sans étape de reconnaissance et donc sans rien à rater. Un
  scan du même document, lui, porte des pixels. Les deux se ressemblent dans une
  boîte aux lettres, et rien en aval ne les distingue si personne ne pose la
  question.

  La question est l'intérêt de ce niveau ; l'extracteur ne l'est pas. Écrire
  l'extracteur est le piège : décompresser les flux de page et décoder les
  opérateurs qui montrent du texte, c'est deux cents lignes qui perdent quand
  même contre la première police que le fichier renumérote pour lui-même — ce
  que fait un traitement de texte à chaque export. Ce travail est fait et
  publié — « pypdf » ici, « pdf.js » en JavaScript, « pdftotext » en ligne de commande — et ce qui
  reste à écrire, c'est la décision.

  La voici : une page qui ne porte aucun texte lisible n'est pas une page vide,
  et la fonction le dit au lieu de rendre une chaîne vide qu'un appelant lirait
  comme « la page est blanche ». Un non vient avec son étape suivante.



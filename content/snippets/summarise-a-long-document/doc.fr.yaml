# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Résumer un document long en choisissant ses meilleures phrases.

  Niveau N0. Extractif : chaque phrase du résumé figure mot pour mot dans la
  source, parce que ce code n'écrit jamais un mot, il ne fait que choisir.

  Deux signaux classiques, et rien d'autre.

  La fréquence des termes. Un mot sur lequel le document revient sans cesse est
  ce dont le document parle, et une phrase dense en mots de ce genre porte donc
  davantage du sujet qu'une phrase faite de mots de liaison. Diviser par la
  longueur de la phrase mesure une densité plutôt qu'un volume, ce qui empêche
  une phrase longue de gagner par sa taille.

  La position. Un auteur énonce son sujet tôt. Un petit bonus qui décroît avec
  le rang de la phrase encode cette habitude, sans livrer pour autant le résumé
  au premier paragraphe.

n1.py: |
  Noter les phrases avec un classifieur entraîné sur des traits de surface.

  Niveau N1. Même forme extractive qu'en N0 — le résumé est toujours fait des
  phrases du document — mais les poids sont appris au lieu d'être devinés.

  N0 fixe à la main, une fois pour tous les documents du monde, l'arbitrage
  entre la position et la densité des termes. Cette constante est une
  supposition. Ici, des documents dont quelqu'un a coché les phrases de résumé
  fixent plutôt les poids de cinq traits, et le modèle n'apprend rien que ces
  cinq ne sachent exprimer. La position est codée 1 / (rang + 1) : le modèle
  peut apprendre que les premières phrases comptent plus ou moins, jamais que
  la dernière compte. Une phrase de conclusion ne gagne que par ce qu'elle
  porte, un chiffre ou un mot-signal comme « overall ».

  Les traits sont délibérément de surface. Ils décrivent où une phrase se
  trouve et à quoi elle ressemble, pas ce qu'elle veut dire. C'est le plafond
  de ce niveau, et la raison pour laquelle la fiche ne s'arrête pas là.

n1.js: |
  Noter les phrases avec un classifieur entraîné sur des traits de surface.

  Niveau N1. Même forme extractive qu'en N0 — le résumé est toujours fait des
  phrases du document — mais les poids sont appris au lieu d'être devinés.

  N0 fixe à la main, une fois pour tous les documents du monde, l'arbitrage
  entre la position et la densité des termes. Cette constante est une
  supposition. Ici, des documents dont quelqu'un a coché les phrases de résumé
  fixent plutôt les poids de cinq traits, et le modèle n'apprend rien que ces
  cinq ne sachent exprimer. La position est codée 1 / (rang + 1) : le modèle
  peut apprendre que les premières phrases comptent plus ou moins, jamais que
  la dernière compte. Une phrase de conclusion ne gagne que par ce qu'elle
  porte, un chiffre ou un mot-signal comme « overall ».

  Les traits sont délibérément de surface. Ils décrivent où une phrase se
  trouve et à quoi elle ressemble, pas ce qu'elle veut dire. C'est le plafond
  de ce niveau, et la raison pour laquelle la fiche ne s'arrête pas là.

  La régression logistique est écrite en entier plutôt que tirée d'une
  bibliothèque, si bien que l'extrait n'a besoin que de Node. La version
  Python de cet extrait appelle scikit-learn ; l'objectif minimisé
  ci-dessous est le même, si bien que les deux classent les phrases d'un
  document de la même façon.

n2: |
  Résumer un document long avec un modèle abstractif auto-hébergé.

  Niveau N2. Le premier niveau qui écrive. N0 et N1 choisissent des phrases et
  ne peuvent jamais rendre que ce que l'auteur a déjà écrit ; celui-ci produit
  des phrases qui n'étaient pas dans le document.

  Ce gain a un prix, et le prix est dans ce fichier plutôt que dans le modèle.
  Un modèle de séquence à séquence lit une fenêtre de taille fixe. Un document
  long n'y entre pas : il faut donc le découper aux frontières de phrase, le
  résumer morceau par morceau, puis résumer les notes, en autant de passes
  qu'il en faut pour tenir dans une seule fenêtre. Chacun de ces appels
  peut échouer ou revenir vide, et un résumé qui ne porte silencieusement que
  sur la moitié d'un document est pire que pas de résumé du tout.

  Ce que ce fichier ne sait pas faire, à aucun prix : vérifier que ce que le
  modèle a écrit est ce que le document disait. Rien dans cette plomberie ne le
  peut. Voyez le test.

  Il ne vérifie pas non plus la langue. Le point de contrôle nommé plus bas
  déclare « language: en » sur sa fiche et a été affiné sur des dépêches
  anglophones ; sur une note française, il écrira quelque chose, et rien ici ne
  l'en empêchera. Il existe un modèle de résumé multilingue — mT5 affiné sur
  XL-Sum, quarante-cinq langues dont le français — sous licence CC BY-SA-NC
  4.0, qui exclut l'usage commercial. Lisez la fiche du modèle avant de
  choisir, et lisez-y la langue d'abord.

n3: |
  Résumer un document long en interrogeant un modèle généraliste.

  Niveau N3. Il est ici pour qu'on voie ce qu'il coûte, pas parce que cette
  fiche le recommande.

  Ce qu'il apporte sur N2 est réel : aucun poids à héberger, aucune machine à
  garder chaude, et une forme de sortie fixée dans l'invite — trois phrases,
  une liste de points, ou les deux — plutôt qu'apprise dans les poids. Que la
  réponse respecte cette forme est vérifié plus bas, pas supposé.

  Ce qu'elle coûte est dans ce fichier. Décider ce qu'un appel a le droit de
  coûter, parce que le fournisseur facture au jeton et qu'un document que
  personne ne voulait envoyer est de l'argent perdu. Réessayer, parce que
  l'appel passe par le réseau. Analyser une réponse qui n'est que probablement le JSON demandé.
  Refuser une réponse de la mauvaise forme plutôt que d'en passer la moitié à
  l'appelant. Cette plomberie est ce que vos tests peuvent couvrir.

  Ce qu'aucun test d'ici ne peut couvrir : si le résumé est vrai du document.
  Rien de ce qui suit ne sait distinguer d'une bonne phrase une phrase fluide
  que le document n'a jamais soutenue. Voyez le test.

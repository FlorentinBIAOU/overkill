n1: |
  Distinguer une couche texte utilisable d'une couche cassée, sur les pages qui
  prétendent en avoir une.

  Niveau N1. Le niveau N0 compte des caractères, et une couche texte faite des
  mauvais caractères en compte tout autant : un PDF dont la police ne porte pas
  de table de caractères, ou en porte une fausse, s'extrait en index de glyphes
  lus comme de l'ASCII — « #$%&!*+,-./0123 » là où la page affiche un
  paragraphe. N0 déclare cette page lisible, et elle ne l'est pas.

  Distinguer la langue de cela, c'est le travail d'un modèle de caractères, et
  c'est le plus petit qui existe : la fréquence de chaque paire de lettres.
  « qu » et « es » sont fréquents en français, « q# » et « &! » ne le sont pas,
  et une page se note à la ressemblance de ses paires avec celles des pages que
  vous tenez déjà pour bonnes.

  Rien n'est livré avec ce modèle. On donne à `fit` le texte de vos propres
  pages lisibles — N0 vient de les lister —, si bien que la référence est faite
  de vos documents, dans votre langue, avec votre vocabulaire. Le seuil vient du
  même endroit : la note la plus basse du lot d'entraînement, avec une marge,
  plutôt qu'un nombre choisi ici. `fit` refuse un lot vide : un modèle ajusté
  sur rien déclarerait tout lisible, et c'est l'erreur coûteuse de cette fiche.

  La marge, elle, est un réglage par défaut et non une constante. Une page du
  lot d'entraînement passe son propre seuil par construction, donc elle ne dit
  rien : le demi-nat vient de quatre pages de prose administrative française
  retenues **hors** du lot — un avenant, un article du code civil, un accusé de
  réception, un en-tête de facture —, qui notent entre −2,42 et −2,83 contre un
  lot dont la pire page note −2,48. La plus éloignée est à 0,35 en dessous : à
  trois dixièmes elle était refusée. Gardez quelques-unes de vos pages lisibles
  hors de `fit`, notez-les, et déplacez ce nombre jusqu'à ce qu'elles passent
  toutes : c'est le seul réglage qui dise quelque chose de vos documents.

  Ce que cela ne sait pas faire, c'est lire. Une page de chiffres, un tableau de
  montants, un formulaire à champs courts : ce sont de vrais textes qu'aucun
  modèle de lettres n'appellera de la langue, et la note le dit. Il sépare les
  lettres du bruit, pas le sens du non-sens.

# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Détecter la langue d'un texte : profils de trigrammes de caractères,
  distance de rang.

  Niveau N0. Déterministe, sans dépendance, et le modèle entier tient en
  quelques centaines de chaînes courtes par langue.

  L'idée vient de Cavnar et Trenkle, en 1994. Chaque langue emploie certains
  trigrammes bien plus que d'autres : « ent », « les », « eur » en français,
  « the », « ing » en anglais, « que », « los » en espagnol. Classez-les par
  fréquence dans un échantillon de la langue, classez-les de nouveau dans le
  texte à identifier, puis comparez les deux ordres. La langue dont l'ordre
  est le plus proche gagne.

  Deux détails font que ça marche.

  D'abord, les mots sont entourés d'espaces avant d'être découpés : un
  trigramme porte ainsi l'information qu'il ouvre ou ferme un mot. « les » au
  milieu d'un mot n'est pas l'article.

  Ensuite, la comparaison porte sur des rangs et non sur des comptes bruts. Un
  compte grandit avec la longueur du texte, un rang non : le même texte répété
  quatre fois garde tous ses rangs. Et la distance est divisée par le nombre de
  trigrammes, si bien qu'un texte long et un texte court tombent sur la même
  échelle.

  Un paragraphe par langue suffit à voir la méthode fonctionner. Il ne suffit
  pas à déployer : les profils ne valent que l'échantillon dont on les tire, et
  un paragraphe laisse de côté l'essentiel d'une langue. Cavnar et Trenkle ont
  bâti les leurs sur des corpus. Prenez plusieurs pages.

n1.py: |
  Détecter la langue d'un texte avec un classifieur bayésien naïf sur des
  n-grammes de caractères.

  Niveau N1. Des traits voisins de ceux de N0, des n-grammes d'un à trois
  caractères découpés aux frontières des mots, mais pondérés au lieu d'être
  classés. Chaque n-gramme du texte vote pour chaque langue, en
  proportion de la fréquence à laquelle cette langue l'emploie, et les votes
  se multiplient entre eux.

  Ce que cela apporte sur la distance de rang de N0, c'est un nombre dont
  l'appelant peut faire quelque chose. N0 répond « français » ; celui-ci
  répond « français, et voici de combien il devance l'espagnol ». Un détecteur
  qui sait s'abstenir vaut mieux qu'un détecteur qui a raison un peu plus
  souvent.

  L'entraînement demande un paragraphe par langue. Le modèle est une table de
  comptes.

n1.js: |
  Détecter la langue d'un texte avec un classifieur bayésien naïf sur des
  n-grammes de caractères.

  Niveau N1. Des traits voisins de ceux de N0, des n-grammes d'un à trois
  caractères découpés aux frontières des mots, mais pondérés au lieu d'être
  classés. Chaque n-gramme du texte vote pour chaque langue, en
  proportion de la fréquence à laquelle cette langue l'emploie, et les votes
  se multiplient entre eux.

  Ce que cela apporte sur la distance de rang de N0, c'est un nombre dont
  l'appelant peut faire quelque chose. N0 répond « français » ; celui-ci
  répond « français, et voici de combien il devance l'espagnol ». Un détecteur
  qui sait s'abstenir vaut mieux qu'un détecteur qui a raison un peu plus
  souvent.

  Écrit en entier plutôt que tiré d'une bibliothèque, parce qu'un bayésien
  naïf multinomial n'est que du comptage, et tient dans ce fichier. C'est l'argument de ce
  niveau : l'outil classique est assez petit pour être lu.

n2: |
  Détecter la langue avec un identifiant dédié, hébergé chez vous.

  Niveau N2. N0 et N1 ne connaissent que les langues dont vous leur avez donné
  un échantillon. CLD3, le Compact Language Detector de Google, est un petit
  réseau de neurones qui couvre une centaine de langues et que le paquet
  embarque avec son modèle : rien à échantillonner, rien à entraîner, pas de
  clé, pas de téléchargement, et aucun texte ne quitte votre machine. « gcld3 »
  en Python, « cld3-asm » en JavaScript, le même modèle dessous.

  Ce que vous possédez à ce niveau n'est pas le modèle. Ce sont trois choses.

  La correspondance entre ses codes et les vôtres : CLD3 répond en style
  BCP 47, et distingue l'hindi en écriture latine de l'hindi en devanagari par
  « hi-Latn ». L'appelant qui attend « hi » reçoit un code qu'il n'a jamais vu.

  Le refus, et le plancher d'octets sur lequel il repose. En dessous de
  « min_bytes », la bibliothèque répond « und » au lieu de deviner, et ce
  plancher — 140 octets par défaut — est justement ce que N0 et N1 n'ont pas :
  c'est le message de deux mots, l'objet de courriel, le champ de recherche,
  refusés par la bibliothèque elle-même. Au-dessus du plancher, « is_reliable »
  et « probability » sont deux poignées de plus, et cet extrait fait des trois
  un refus.

  Et le chargement. Le modèle est lu quand l'identifiant est construit, et
  l'identifiant retient de la mémoire dont le ramasse-miettes ne s'occupe pas :
  construisez-en un, gardez-le, n'en construisez pas un par message.

n3: |
  Détecter la langue d'un texte en interrogeant un modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord. Elle est ici
  pour qu'on voie ce qu'elle coûte, pas parce que cette fiche la recommande.

  Voyez ce que le code doit faire et que N0 ne faisait pas : n'envoyer qu'un
  extrait, réessayer en cas d'échec, analyser une réponse qui n'est que
  probablement du JSON valide, normaliser un code que le modèle peut écrire en
  capitales, avec une région ou entouré d'espaces, et refuser une réponse qui
  sort de la liste qu'on lui a fournie. Cette plomberie est le vrai coût de ce
  niveau, et c'est la part que vos tests doivent couvrir, parce que le modèle
  lui-même n'est pas testable.

  La seule chose que ce niveau apporte vraiment, c'est qu'il n'a besoin
  d'aucun échantillon de la langue. La seule chose qu'il ne sait pas faire,
  c'est vous dire qu'il se trompe.

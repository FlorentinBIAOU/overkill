# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Détecter la langue d'un texte : profils de trigrammes de caractères,
  distance de rang.

  Niveau N0. Déterministe, sans dépendance, et le modèle entier tient en
  quelques centaines de chaînes courtes par langue.

  L'idée est plus vieille que la plupart du domaine. Chaque langue répète ses
  propres trigrammes : « ent », « les », « eur » en français, « the », « ing »
  en anglais, « que », « los » en espagnol. Classez ces trigrammes par
  fréquence dans un échantillon de la langue, classez-les de nouveau dans le
  texte à identifier, puis comparez les deux ordres. La langue dont l'ordre
  est le plus proche gagne.

  Deux détails font que ça marche.

  D'abord, les mots sont entourés d'espaces avant d'être découpés : un
  trigramme porte ainsi l'information qu'il ouvre ou ferme un mot. « les » au
  milieu d'un mot n'est pas l'article.

  Ensuite, la comparaison porte sur des rangs et non sur des fréquences. Un
  rang survit sans changer à un échantillon quatre fois plus long, et à un
  texte quatre fois plus court.

n1.py: |
  Détecter la langue d'un texte avec un classifieur bayésien naïf sur des
  n-grammes de caractères.

  Niveau N1. Les mêmes traits qu'en N0, un à trois caractères, mais pondérés
  au lieu d'être classés. Chaque n-gramme du texte vote pour chaque langue, en
  proportion de la fréquence à laquelle cette langue l'emploie, et les votes
  se multiplient entre eux.

  Ce que cela apporte sur la distance de rang de N0, c'est un nombre dont
  l'appelant peut faire quelque chose. N0 répond « français » ; celui-ci
  répond « français, et voici de combien il devance l'espagnol ». Un détecteur
  qui sait s'abstenir vaut mieux qu'un détecteur qui a raison un peu plus
  souvent.

  L'entraînement tient en un paragraphe par langue et une fraction de
  seconde. Le modèle est une table de comptes.

n1.js: |
  Détecter la langue d'un texte avec un classifieur bayésien naïf sur des
  n-grammes de caractères.

  Niveau N1. Les mêmes traits qu'en N0, un à trois caractères, mais pondérés
  au lieu d'être classés. Chaque n-gramme du texte vote pour chaque langue, en
  proportion de la fréquence à laquelle cette langue l'emploie, et les votes
  se multiplient entre eux.

  Ce que cela apporte sur la distance de rang de N0, c'est un nombre dont
  l'appelant peut faire quelque chose. N0 répond « français » ; celui-ci
  répond « français, et voici de combien il devance l'espagnol ». Un détecteur
  qui sait s'abstenir vaut mieux qu'un détecteur qui a raison un peu plus
  souvent.

  Écrit en entier plutôt que tiré d'une bibliothèque, parce qu'un bayésien
  naïf multinomial, c'est trente lignes de comptage. C'est l'argument de ce
  niveau : l'outil classique est assez petit pour être lu.

n3: |
  Détecter la langue d'un texte en interrogeant un modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord. Elle est ici
  pour qu'on voie ce qu'elle coûte, pas parce que cette fiche la recommande.

  Voyez ce que le code doit faire et que N0 ne faisait pas : plafonner
  l'entrée, n'envoyer qu'un extrait, réessayer en cas d'échec, analyser une
  réponse qui n'est que probablement du JSON valide, normaliser un code que le
  modèle peut écrire d'une demi-douzaine de façons, et refuser une réponse qui
  sort de la liste qu'on lui a fournie. Cette plomberie est le vrai coût de ce
  niveau, et c'est la part que vos tests doivent couvrir, parce que le modèle
  lui-même n'est pas testable.

  La seule chose que ce niveau apporte vraiment, c'est qu'il n'a besoin
  d'aucun échantillon de la langue. La seule chose qu'il ne sait pas faire,
  c'est vous dire qu'il se trompe.

# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Découper une adresse postale en champs : des expressions régulières ancrées
  sur le code postal.

  Niveau N0. Déterministe, bibliothèque standard seule, et assez court pour se
  lire d'une traite.

  Deux choses font que ça marche.

  D'abord, le code postal sert d'ancre. Cinq chiffres d'affilée coupent une
  adresse française en deux : ce qui précède est la ligne de voie, ce qui suit
  est la ville. Vouloir reconnaître la ville à son nom obligerait à embarquer
  une liste des communes et à la tenir à jour.

  Ensuite, le type de voie est lu dans un dictionnaire plutôt que deviné, pour
  que les abréviations que les gens tapent vraiment — « av. », « bd », « imp. »
  — ressortent sous une seule orthographe canonique.

n1.js: |
  Étiqueter chaque jeton d'une adresse par une régression logistique sur des
  traits de contexte.

  Niveau N1. N0 lit l'adresse qu'il attend ; celui-ci lit l'adresse qu'on lui
  donne. Chaque mot est étiqueté pour lui-même — numéro, type de voie, nom de
  voie, complément, code postal, ville — d'après ce à quoi il ressemble et
  d'après ce qui se trouve de part et d'autre. Les champs sont ensuite
  reconstruits à partir des étiquettes.

  C'est là tout le gain : un complément au milieu de la ligne n'avale plus la
  voie, parce que « Bâtiment » est un mot que le modèle a déjà vu à cette place,
  et non un jeton imprévu dans un motif figé.

  Une régression binaire par étiquette, entraînée par simple descente de
  gradient, et la plus forte l'emporte. Écrite ici plutôt que tirée d'une
  bibliothèque, parce que cela fait quarante lignes et que c'est l'argument de
  ce niveau.

n1.py: |
  Étiqueter chaque jeton d'une adresse par une régression logistique sur des
  traits de contexte.

  Niveau N1. N0 lit l'adresse qu'il attend ; celui-ci lit l'adresse qu'on lui
  donne. Chaque mot est étiqueté pour lui-même — numéro, type de voie, nom de
  voie, complément, code postal, ville — d'après ce à quoi il ressemble et
  d'après ce qui se trouve de part et d'autre. Les champs sont ensuite
  reconstruits à partir des étiquettes.

  C'est là tout le gain : un complément au milieu de la ligne n'avale plus la
  voie, parce que « Bâtiment » est un mot que le modèle a déjà vu à cette place,
  et non un jeton imprévu dans un motif figé.

  Le prix est un jeu d'entraînement étiqueté. Quelques dizaines d'adresses
  étiquetées à la main suffisent pour commencer, et toute convention absente de
  ce jeu est une convention que le modèle ne connaît pas.

n2: |
  Découper une adresse avec un analyseur statistique auto-hébergé.

  Niveau N2. libpostal est un analyseur entraîné sur des dizaines de millions
  d'adresses issues de données ouvertes mondiales. Il étiquette un jeton d'après
  son contexte, comme au niveau N1, mais son jeu d'entraînement est la planète :
  le numéro allemand qui suit la rue, le code postal britannique qui ne fait pas
  cinq chiffres, l'ordre japonais qui commence par la préfecture. Il tourne sur
  votre machine, donc aucune adresse n'en sort.

  Ce qui vous appartient à ce niveau n'est pas le modèle. C'est le lot, la borne
  de taille, la correspondance entre son jeu d'étiquettes et le vôtre, et la
  réponse à « que fait le code quand l'analyseur renvoie quelque chose
  d'inutilisable ». Le modèle est une boîte noire, avec une liste d'étiquettes
  fixe et aucun score de confiance, et la dernière fonction ci-dessous est
  l'endroit où cela devient votre problème.

n3: |
  Découper une adresse en appelant un modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on va d'abord. Elle est ici pour qu'on
  voie ce qu'elle coûte, pas parce que cette fiche la recommande.

  Notez ce que le code doit faire et que N0 ne faisait pas : borner la taille de
  l'entrée, réessayer après un échec, analyser une réponse qui n'est que
  probablement du JSON valide, et vérifier que les champs rendus étaient bien
  dans l'adresse. Ce dernier point est propre à l'extraction : un modèle à qui
  l'on demande un code postal et qui n'en a pas en fournira volontiers un
  plausible, et un code postal plausible est pire qu'un champ vide, parce que
  rien en aval ne le mettra jamais en doute.

  Cette plomberie est le vrai coût de ce niveau, et c'est la part que vos tests
  doivent couvrir, parce que le modèle lui-même n'est pas testable.

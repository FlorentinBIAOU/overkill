# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Construire un jeu de données de test à partir d'un schéma et d'une graine.

  Niveau N0. Bibliothèque standard seule, aucun fichier écrit : la fonction
  renvoie une liste de lignes qu'un test peut passer telle quelle au code qu'il
  éprouve.

  Le déterminisme est tout l'enjeu. La même graine et le même schéma donnent
  exactement les mêmes lignes, en Python comme en JavaScript, tant que ce code
  reste inchangé. C'est ce qui rend un test en échec rejouable et une régression
  reproductible : la graine imprimée à côté d'un échec suffit à reconstruire la
  donnée qui l'a causé.

  C'est pourquoi le générateur est écrit ici au lieu d'être pris à la
  plateforme. Le `random` de Python accepte une graine, le `Math.random` de
  JavaScript non : un jeu de données bâti sur eux ne peut donc pas être passé
  d'un langage à l'autre, ni comparé entre un serveur et une interface. Une
  bibliothèque comme Faker ne trancherait pas non plus : sa propre
  documentation prévient que les valeurs produites par une graine donnée
  peuvent changer d'une version à l'autre.

  Chaque cellule est tirée d'un hachage de (graine, champ, ligne) plutôt que
  d'un flux qui se déroule. Ajouter un champ au schéma laisse par conséquent
  toutes les autres colonnes intactes, au lieu de décaler le jeu entier d'un
  tirage.


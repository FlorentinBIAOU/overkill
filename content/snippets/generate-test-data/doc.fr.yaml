n1.py: |
  Tirer un jeu de données de test dans les distributions observées en
  production.

  Niveau N1. Bibliothèque standard seule, aucun fichier écrit, et toujours
  aucun réseau : les distributions viennent de l'appelant, telles qu'un
  `GROUP BY` les renverrait.

  Ce que cela apporte sur N0. Un schéma dit qu'une quantité est entre un et
  neuf ; il ne dit pas que la plupart des commandes portent sur un article et
  presque aucune sur neuf. Une donnée tirée uniformément à l'intérieur des
  bornes donne à chaque cas rare le même poids qu'au cas courant : un taux de
  succès de cache mesuré dessus ne veut rien dire, une page dessinée pour elle
  ne ressemble en rien à la vraie, et la requête lente reste rapide.

  Ce qui est tiré ici, c'est la distribution marginale de chaque colonne, une
  colonne à la fois : l'effectif observé par catégorie, et l'effectif observé
  par tranche d'une colonne numérique. Rien n'est ajusté et rien n'est appris —
  la table observée est le modèle. Ce qui veut dire aussi que la distribution
  conjointe est perdue, et les tests à côté de ce fichier montrent ce que cela
  coûte.

  Le déterminisme fonctionne exactement comme en N0, et pour la même raison :
  un jeu de données qui n'est reproductible qu'en moyenne n'est pas
  reproductible.


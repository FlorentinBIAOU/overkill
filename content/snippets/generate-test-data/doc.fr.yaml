n3: |
  Rédiger les champs textuels d'un jeu de données de test en interrogeant un
  modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord, et elle apporte
  bien quelque chose de réel : un ticket de support qui se lit comme un ticket
  de support, avec les fautes de frappe, les majuscules et les deux questions
  dans une même phrase qu'aucun gabarit ne produit.

  Elle abandonne aussi la propriété sur laquelle les niveaux du dessous étaient
  bâtis. Il n'y a pas de graine ici. Deux appels avec la même consigne
  renvoient des lignes différentes : le jeu de données doit donc être produit
  une fois puis conservé, comme une fixture, et non reconstruit à la demande.

  Et le modèle ne garantit rien : ni les clés demandées, ni le nombre de
  lignes, ni l'unicité d'un identifiant. Voyez quelle part de ce fichier
  vérifie au lieu de demander. Cette plomberie est le vrai coût du niveau, et
  c'est la part que les tests peuvent couvrir, parce que le modèle lui-même
  n'est pas testable.

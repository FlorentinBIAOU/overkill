n3: |
  Rédiger les champs textuels d'un jeu de données de test en interrogeant un
  modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord, et le seul
  niveau de cette fiche qui rédige du texte libre au lieu de choisir parmi des
  valeurs que l'appelant a listées.

  Elle abandonne aussi la propriété sur laquelle les niveaux du dessous étaient
  bâtis. Il n'y a pas de graine ici : la requête porte une consigne et une
  température, et rien qui ferait répéter au second appel ce qu'a rendu le
  premier. Le jeu de données doit donc être produit une fois puis conservé,
  comme une fixture, et non reconstruit à la demande.

  Et une consigne n'est qu'une demande : rien en elle n'astreint le modèle aux
  clés demandées, au nombre de lignes ni à l'unicité d'un identifiant. Voyez quelle part de ce fichier
  vérifie au lieu de demander. Cette plomberie est le vrai coût du niveau, et
  c'est la part que les tests peuvent couvrir, parce que le modèle lui-même
  n'est pas testable.

# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Trier des produits par un score pondéré : correspondance textuelle,
  disponibilité, marge, popularité.

  Niveau N0. Déterministe, sans dépendance, et surtout discutable : les quatre
  pondérations sont des arguments, pas des constantes enfouies dans le code.
  C'est tout l'intérêt de l'approche. Quand le commerce dit que le premier
  résultat est mauvais, la discussion porte sur un nombre qu'un responsable de
  rayon peut lire, et la réponse arrive dans l'après-midi plutôt que dans un
  cycle de réentraînement.

  Deux décisions la rendent utilisable.

  Chaque signal est sur la même échelle de zéro à un avant que les pondérations
  ne le touchent : le texte et la disponibilité par construction, la marge et
  la popularité parce qu'une valeur hors de l'échelle y est ramenée plutôt que
  laissée écraser les autres. Un poids de deux compte vraiment deux fois plus,
  et le score, moyenne sur des pondérations qui ne peuvent pas être négatives,
  reste dans cette échelle.

  Ramenée, et non refusée : une marge de -0,05 existe pour de bon — un
  déstockage vendu à perte — et cette fonction est appelée sur chaque page de
  résultats. Un seul produit mal renseigné ne doit pas faire tomber toute la
  page de catégorie. Les produits dont un signal a dû être déplacé ressortent
  nommés, pour que le défaut se voie au lieu de se taire. Les pondérations sont
  une autre affaire : elles viennent du code, et une pondération qui n'est pas
  un nombre fini, nul ou positif, est refusée.

  Le tri est stable : deux produits que le score ne sait pas séparer restent
  dans l'ordre où le catalogue les a donnés. Un tri instable rebattrait les
  résultats à égalité d'un affichage à l'autre, et plus personne ne saurait
  reproduire une réclamation.

n1.py: |
  Apprendre les pondérations de classement des interactions passées au lieu de
  les régler à la main.

  Niveau N1. Le score repose sur les mêmes quatre signaux qu'en N0, chacun
  entre zéro et un. Ce qui change, c'est l'origine des quatre pondérations : le
  jugement d'un responsable de rayon en N0, le journal de clics ici.

  La méthode est par paires, et une seule sorte de paire compte : un produit
  cliqué contre un produit montré **au-dessus de lui** et laissé de côté. C'est
  la stratégie « Click > Skip Above » de Joachims et de ses coauteurs, et sa
  raison d'être est le biais de position qu'ils ont mesuré : un produit montré
  sous le clic n'a peut-être jamais été regardé, si bien que l'apparier au clic
  n'enseigne rien sur les produits et tout sur l'ordre que le classement
  précédent produisait déjà. Le modèle apprendrait à reproduire N0, ce qui est
  l'inverse de ce pour quoi on monte.

  Chaque paire retenue devient une ligne d'entraînement, la différence
  entre les deux vecteurs de signaux, et une régression logistique sur ces
  différences redonne les pondérations du score d'origine. Les signaux montrés
  au rayon restent les mêmes ; le score, non. Des pondérations apprises peuvent
  être négatives : le score est donc une simple somme sur des pondérations dont
  les valeurs absolues totalisent un, entre moins un et un, là où N0 prend une
  moyenne sur des pondérations qui ne peuvent pas être négatives.

  Chaque paire est ajoutée dans les deux sens, l'une étiquetée gagnante et
  l'autre perdante. Cela maintient les deux classes équilibrées, et c'est
  pourquoi le modèle ne porte pas d'ordonnée à l'origine : une constante
  décalerait les deux sens d'une même paire de la même façon, ce qui n'a pas
  de sens quand on compare deux produits d'une même page de résultats.


# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Écarter le spam d'un formulaire de contact : pot de miel, délai de
  soumission, plafond de liens, phrases interdites.

  Niveau N0. Quatre contrôles, aucune dépendance, aucune donnée
  d'entraînement, et un rejet qui vient avec un motif présentable à qui
  demande pourquoi son message s'est perdu.

  Deux des contrôles regardent l'expéditeur plutôt que le texte. Un champ
  caché dans le formulaire, laissé vide par tout être humain, et le temps
  passé sur la page attrapent les scripts qui postent sur le point de
  terminaison sans jamais l'afficher. C'est l'essentiel du trafic, et aucune
  lecture du message n'aurait fait mieux.

  Les deux contrôles de texte sont la moitié faible, et la fiche le dit.

n1.js: |
  Distinguer le spam d'une vraie demande avec un classifieur linéaire sur des
  n-grammes de caractères.

  Niveau N1. Les règles de N0 cherchent les mots qu'un spammeur employait
  l'an dernier. Celui-ci regarde la façon dont le message est écrit :
  quelques centaines d'envois étiquetés, ceux qu'une boîte de réception
  contient déjà, et le modèle apprend le registre plutôt que la liste de
  vocabulaire.

  Écrit en entier plutôt que tiré d'une bibliothèque, parce qu'un TF-IDF sur
  n-grammes de caractères et une régression logistique ajustée par descente
  de gradient tiennent en quarante lignes. C'est tout l'argument de ce
  niveau : l'outil classique est assez petit pour être lu.

n1.py: |
  Distinguer le spam d'une vraie demande avec un classifieur linéaire sur des
  n-grammes de caractères.

  Niveau N1. Les règles de N0 cherchent les mots qu'un spammeur employait
  l'an dernier. Celui-ci regarde la façon dont le message est écrit :
  quelques centaines d'envois étiquetés, ceux qu'une boîte de réception
  contient déjà, et le modèle apprend le registre plutôt que la liste de
  vocabulaire.

  Des n-grammes de caractères plutôt que des mots, pour deux raisons. Ils
  survivent aux graphies employées pour contourner une liste de mots,
  « b a c k l i n k s », « backl1nks », et ils n'exigent aucun segmenteur
  qu'il faudrait régler langue par langue.

  La décision est une somme pondérée : vous pouvez donc imprimer les traits
  qui ont fait passer un message de l'autre côté de la ligne, ce qui compte
  la première fois qu'on vous demande pourquoi sa demande a été rejetée.

n3: |
  Trier un envoi de formulaire de contact en interrogeant un modèle
  généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord. Elle est ici
  pour qu'on voie ce qu'elle coûte, pas parce que cette fiche la recommande.

  Voyez ce que le code doit faire et que N0 n'avait pas à faire : plafonner
  la taille de l'entrée, réessayer après l'échec du fournisseur, analyser une
  réponse qui n'est que probablement du JSON valide, et refuser de deviner
  quand elle est inexploitable. Cette plomberie est le vrai coût du niveau,
  et c'est la part que vos tests doivent couvrir, parce que le modèle
  lui-même n'est pas testable.

  Voyez aussi ce qu'il ne peut pas faire. Le message entre dans la même
  invite que les consignes, et rien dans le protocole ne dit au modèle auquel
  des deux obéir.

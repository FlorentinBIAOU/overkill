# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Écarter le spam d'un formulaire de contact : pot de miel, délai de
  soumission, plafond de liens, phrases interdites.

  Niveau N0. Quatre contrôles, aucune dépendance, aucune donnée
  d'entraînement, et un rejet qui vient avec un motif présentable à qui
  demande pourquoi son message s'est perdu.

  Deux des contrôles regardent l'expéditeur plutôt que le texte. Un champ
  pot de miel, soustrait à la vue dans le formulaire, et le temps passé sur
  la page attrapent les scripts qui postent sur le point de terminaison sans
  l'afficher, pour peu qu'ils remplissent tous les champs ou postent plus
  vite qu'une personne ne tape. Aucun des deux n'a besoin de lire le message.

  Les deux contrôles de texte sont la moitié faible, et la fiche le dit.

n1.js: |
  Distinguer le spam d'une vraie demande avec un classifieur linéaire sur des
  n-grammes de caractères.

  Niveau N1. Les règles de N0 cherchent les mots d'une liste. Celui-ci note
  les fragments de caractères d'un message, avec des poids appris sur des
  envois étiquetés, pris parmi ceux que la boîte de réception a déjà reçus.

  Écrit en entier plutôt que tiré d'une bibliothèque, parce qu'un TF-IDF sur
  n-grammes de caractères et une régression logistique ajustée par descente
  de gradient tiennent dans ce fichier, sans dépendance. C'est tout l'argument de ce
  niveau : l'outil classique est assez petit pour être lu.

n1.py: |
  Distinguer le spam d'une vraie demande avec un classifieur linéaire sur des
  n-grammes de caractères.

  Niveau N1. Les règles de N0 cherchent les mots d'une liste. Celui-ci note
  les fragments de caractères d'un message, avec des poids appris sur des
  envois étiquetés, pris parmi ceux que la boîte de réception a déjà reçus.

  Des n-grammes de caractères plutôt que des mots : « backlink »,
  « backlinks » et « backlinking » partagent ainsi l'essentiel de leurs
  traits. Un mot épelé lettre à lettre, « b a c k l i n k s », n'en partage
  aucun : aucun n-gramme ne franchit une espace.

  La décision est une somme pondérée : vous pouvez donc imprimer les traits
  qui ont fait passer un message de l'autre côté de la ligne, ce qui compte
  la première fois qu'on vous demande pourquoi sa demande a été rejetée.

n3: |
  Trier un envoi de formulaire de contact en interrogeant un modèle
  généraliste.

  Niveau N3. Il est ici pour qu'on voie ce qu'il coûte, pas parce que cette
  fiche le recommande.

  Voyez ce que le code doit faire et que N0 n'avait pas à faire : refuser une
  entrée vide ou trop longue avant de payer un appel, redemander quand le
  fournisseur échoue ou répond quelque chose d'inexploitable, chaque essai
  étant facturé, analyser une réponse qui n'est que probablement du JSON
  valide, et refuser de deviner quand aucun essai n'est exploitable. Cette
  plomberie est le vrai coût du niveau, et c'est la part que vos tests
  doivent couvrir, parce qu'un test contre un double ne dit rien de la façon
  dont le modèle juge.

  Voyez aussi ce qu'il ne peut pas faire. Le message entre dans la même
  invite que les consignes, et rien dans le protocole ne dit au modèle auquel
  des deux obéir.

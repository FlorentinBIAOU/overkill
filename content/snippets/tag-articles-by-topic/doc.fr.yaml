# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Étiqueter des articles depuis un vocabulaire contrôlé, par correspondance
  après une lemmatisation simple.

  Niveau N0. Déterministe, bibliothèque standard seule, et vérifiable : chaque
  étiquette se remonte jusqu'au terme qui l'a produite, ce que demande un
  rédacteur la première fois qu'une étiquette paraît fausse.

  Deux choses font que ça marche.

  D'abord, l'article et le vocabulaire passent par exactement la même chaîne. Un
  racineur appliqué d'un seul côté échouera allègrement à faire correspondre un
  mot avec lui-même.

  Ensuite, l'étiquetage est multi-étiquette par construction. Un article traite
  plusieurs thèmes, ou aucun ; une fonction qui rend un thème par article répond
  à une question que personne n'a posée.

n1.js: |
  Étiqueter des articles avec un classifieur un contre tous sur des traits
  TF-IDF.

  Niveau N1. Le vocabulaire contrôlé du niveau N0 voit les mots qu'un rédacteur
  a énumérés. Celui-ci voit les mots qui vont avec un thème dans les articles
  que vous avez déjà étiquetés — « bureau », « visioconférence » et « domicile »
  finissent par porter le thème du télétravail, alors qu'aucun rédacteur ne les
  aurait jamais inscrits dans une liste de termes.

  Un classifieur par thème, chacun répondant à sa propre question par oui ou par
  non. C'est ce que veut dire un contre tous, et c'est ce qui garde l'étiquetage
  multi-étiquette : les thèmes ne se disputent pas un vainqueur unique, si bien
  qu'un article peut ressortir avec trois étiquettes, ou avec aucune.

  Écrit à la main plutôt que tiré d'une bibliothèque, parce que TF-IDF et la
  régression logistique tiennent sur une page à eux deux. Ce que coûte ce niveau
  n'est pas le code ci-dessous : c'est le corpus étiqueté que quelqu'un doit
  étiqueter à la main, et étiqueter de nouveau chaque fois que la taxonomie
  bouge.

n1.py: |
  Étiqueter des articles avec un classifieur un contre tous sur des traits
  TF-IDF.

  Niveau N1. Le vocabulaire contrôlé du niveau N0 voit les mots qu'un rédacteur
  a énumérés. Celui-ci voit les mots qui vont avec un thème dans les articles
  que vous avez déjà étiquetés — « bureau », « visioconférence » et « domicile »
  finissent par porter le thème du télétravail, alors qu'aucun rédacteur ne les
  aurait jamais inscrits dans une liste de termes.

  Un classifieur par thème, chacun répondant à sa propre question par oui ou par
  non. C'est ce que veut dire un contre tous, et c'est ce qui garde l'étiquetage
  multi-étiquette : les thèmes ne se disputent pas un vainqueur unique, si bien
  qu'un article peut ressortir avec trois étiquettes, ou avec aucune.

  Ce que coûte ce niveau n'est pas le code, qui est ci-dessous. C'est le corpus
  étiqueté : quelques centaines d'articles que quelqu'un doit étiqueter à la
  main, et étiqueter de nouveau chaque fois que la taxonomie bouge.

n2: |
  Étiquetage sans exemple : comparer l'article aux étiquettes elles-mêmes.

  Niveau N2. Le niveau N1 demandait un corpus étiqueté, et un thème nouveau
  voulait dire tout réétiqueter. Ici un thème n'est qu'une courte description,
  encodée comme n'importe quel autre texte : en ajouter un coûte une ligne, et
  le premier article peut être étiqueté le jour même.

  C'est tout l'attrait du niveau, et il est réel. Ce qu'il coûte est un fichier
  de modèle à livrer et à tenir à jour, un processus chaud pour le garder en
  mémoire, et un score qui est un cosinus plutôt qu'une probabilité — voyez le
  test pour ce que cela veut dire quand il faut choisir un seul seuil pour tous
  les thèmes.

n3: |
  Étiqueter des articles en interrogeant un modèle généraliste.

  Niveau N3. C'est l'option vers laquelle on se tourne d'abord, et sur cette
  fiche c'est la seule qui ne demande ni liste de termes, ni corpus étiqueté, ni
  fichier de modèle. Elle est là pour qu'on voie ce qu'elle coûte, pas parce que
  cette fiche la recommande.

  Voyez ce que le code doit faire et que le niveau N0 n'avait pas à faire :
  borner la taille de l'entrée, réessayer en cas d'échec, analyser une réponse
  qui n'est que probablement du JSON valide, et ne garder que les thèmes qui
  existent dans votre taxonomie. Ce dernier point n'est pas facultatif — un
  modèle inventera volontiers un thème plausible — et c'est pourquoi le
  vocabulaire reste un paramètre ici, exactement comme au niveau le plus bas.

  Cette plomberie est le vrai coût de ce niveau, et c'est la part que vos tests
  doivent couvrir, puisque le modèle lui-même n'est pas testable.

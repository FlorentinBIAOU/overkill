# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Réemployer les traductions que vous avez déjà payées : une mémoire de
  traduction.

  Niveau N0. Aucun modèle, aucun service, aucune clé. Une chaîne déjà dans la
  mémoire retrouve sa traduction, et la traduction la moins chère est celle
  qu'on ne commande pas deux fois.

  Trois réponses, et la différence entre elles compte plus que le code. Une
  correspondance exacte part en production : la même chaîne, à l'espacement,
  aux caractères de format invisibles et à la composition Unicode près. Une
  chaîne assez proche est une correspondance approchée — un mot ajouté, une
  majuscule ou un accent changé — et c'est un brouillon : elle revient avec son
  score et un drapeau de relecture, jamais comme une traduction finie, parce
  que « Polish » et « polish » ne sont pas le même mot. Tout le reste est du
  texte nouveau, dont ce niveau n'a rien à dire — voyez le point de rupture
  dans le test.

  Les variables d'interpolation sont vérifiées à part du score. Une traduction
  dont les variables ne correspondent pas à la source est une interface cassée,
  quel que soit son score : elle est donc signalée même sur une correspondance
  exacte. Un message ICU de pluriel ou de sélection est vérifié sur le nom et le
  type de son argument, pas sur les branches qu'il contient.

  Une chaîne plus longue que MAX_FUZZY_CHARACTERS n'a droit qu'aux
  correspondances exactes : comparer deux textes longs coûte de l'ordre du
  produit de leurs longueurs, pour chaque entrée de la mémoire.

n2: |
  Traduire avec un modèle neuronal auto-hébergé, une paire de langues à la
  fois.

  Niveau N2. C'est le niveau qui traduit : contrairement à la mémoire de N0, il
  rend une réponse pour une chaîne qui n'est dans aucune mémoire. Le prix, c'est
  un modèle par paire de langues : celui-ci lit l'anglais et écrit le français.

  L'essentiel du code ci-dessous ne concerne pas la traduction. Il concerne les
  variables d'interpolation. Un modèle de traduction lit `{count}` comme du
  texte : lancé sur opus-mt-en-fr, `{count} items selected` revient en
  `{compte} éléments sélectionnés`, et l'interface affiche une accolade là où
  un nombre devait être.

  Chaque variable est donc remplacée par un marqueur numéroté avant que le
  modèle ne voie la chaîne, remise ensuite, et comptée. Déplacer un marqueur
  est permis : l'ordre des mots est l'affaire du modèle. En perdre un ou en
  inventer un est signalé, et l'appelant reçoit un brouillon marqué plutôt
  qu'une interface cassée. Un message ICU de pluriel ou de sélection part
  toujours en relecture : ses branches mêlent du texte à traduire et des
  mots-clés à garder, et un marqueur ne sait pas séparer les deux.

n3: |
  Traduire en interrogeant un modèle généraliste, avec le contexte d'interface.

  Niveau N3. Ce que ce niveau apporte face à un modèle de traduction, c'est le
  contexte : un modèle traducteur reçoit une chaîne et rien d'autre, tandis qu'à
  un modèle généraliste on peut dire que `Save` est le libellé d'un bouton et
  non le verbe d'une phrase, que l'interface s'adresse à un client plutôt qu'à
  un administrateur, et qu'il n'y a pas la place d'une phrase entière.

  Ce qu'il coûte, c'est tout ce qui entoure l'appel : une clé, un fournisseur
  qui répond de la prose quand on a demandé du JSON, des reprises, un plafond
  sur l'entrée, et le même contrôle des variables qu'au niveau du dessous,
  parce que se faire demander de garder `{count}` tel quel n'est pas la même
  chose que le faire.

# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n0.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0.py: |
  Chercher dans vos propres documents avec l'index plein texte de la base de
  données que vous exploitez déjà.

  Niveau N0. SQLite embarque FTS5 : une table virtuelle qui porte un index
  inversé, et une fonction de classement bm25(). Postgres a tsvector et
  ts_rank, MySQL a FULLTEXT ... IN NATURAL LANGUAGE MODE. Ce qui tourne sous
  votre application a déjà un index et un classement.

  Deux choses sont à savoir avant de s'en servir.

  D'abord, bm25() rend un nombre négatif, le meilleur résultat étant le plus
  négatif. Prenez l'opposé, comme ci-dessous, et un score plus grand redevient
  un meilleur résultat.

  Ensuite, MATCH prend un langage de requête, pas une chaîne. Un utilisateur
  qui tape un guillemet droit, AND ou NEAR ne doit jamais lui être transmis
  tel quel : entourer chaque jeton de guillemets ramène la requête à des mots
  ordinaires, et une erreur de syntaxe à une recherche.

  Ces guillemets sont aussi ce à quoi ce fichier renonce : un jeton entre
  guillemets est cherché en entier. Pour une barre de recherche qui répond à la
  frappe, FTS5 sait chercher un préfixe — une « * » après une chaîne entre
  guillemets, « "cong"* » — et cet extrait ne s'en sert pas, parce qu'un préfixe
  sur chaque terme élargit toutes les recherches, pas seulement celle qu'on est
  en train de taper.

n0.js: |
  Chercher dans vos propres documents avec l'index plein texte de la base de
  données que vous exploitez déjà.

  Niveau N0. La version Python de cet extrait tient en quatre instructions SQL
  adressées à FTS5, dans SQLite : une table virtuelle qui porte un index
  inversé, et une fonction de classement bm25(). Postgres a tsvector et
  ts_rank, MySQL a FULLTEXT ... IN NATURAL LANGUAGE MODE. Ce qui tourne sous
  votre application a déjà un index et un classement : à ce niveau, vous
  écrivez du SQL, pas un algorithme.

  Node 22 livre `node:sqlite` (derrière --experimental-sqlite avant la 22.13.0).
  Le SQLite qu'il embarque n'a pas le module FTS5 avant Node 22.16.0, et l'a à
  partir de la 22.16.0 : le SQL de la version Python y tourne alors tel quel,
  et rend les mêmes scores que ce fichier. Ce fichier écrit malgré tout ce que
  fait la table FTS5 : le même découpage en jetons (minuscules, accents retirés
  des lettres latines), le même ET implicite entre les termes, le même BM25 avec
  les mêmes constantes et les mêmes poids de colonne. C'est un choix, pas une
  nécessité : il n'importe rien, il tourne donc partout où tourne JavaScript, un
  navigateur compris, et chaque étape du classement se lit. Lisez-le comme la
  documentation du SQL. Sur un serveur en Node 22.16.0 ou plus récent,
  déployez le SQL, pas ce fichier.

  Une chose que le SQL a et que celui-ci n'a pas : la recherche par préfixe.
  Pour une barre qui répond à la frappe, FTS5 cherche un préfixe quand une « * »
  suit une chaîne entre guillemets, « "cong"* ». Aucune des deux versions ne
  s'en sert, parce qu'un préfixe sur chaque terme élargit toutes les
  recherches, pas seulement celle qu'on est en train de taper.

n1: |
  Chercher dans vos propres documents avec un index inversé et un BM25 que
  vous avez écrits.

  Niveau N1. Non parce que l'index de N0 serait mauvais — N0 reste la
  recommandation — mais parce que le code ci-dessous est un BM25 qu'on peut
  lire, et que le lire une fois vous dit pourquoi un document s'est classé là
  où il s'est classé. Il ne reproduit pas FTS5 à la décimale près : la règle
  d'appariement, l'IDF, la longueur et le poids du titre diffèrent, et chacun
  est une ligne que vous pouvez changer.

  Trois décisions vous appartiennent ici, qui appartenaient au moteur avant.

  Le découpage en jetons : ce qui compte pour un mot, quels accents sont
  repliés, quels termes sont écartés. La règle d'appariement : celle-ci garde
  tout document qui porte au moins un terme, là où FTS5 les exige tous. Et le
  classement : k1 sature la répétition, b corrige la longueur du document, et
  les poids de champ disent ce que vaut un titre. Changez-en une et l'ordre
  change ; c'est tout l'intérêt d'en être propriétaire.

n2: |
  Ajouter une jambe vectorielle à la recherche plein texte que vous avez déjà.

  Niveau N2. N0 et N1 apparient des mots. Un lecteur qui demande « vacances »
  là où le manuel dit « congés payés » n'obtient rien, et c'est ce trou que ce
  niveau existe pour combler : un encodeur de phrases auto-hébergé, conçu pour
  la recherche sémantique, projette chaque texte sur un vecteur dense, et les
  textes se comparent sur ces vecteurs plutôt que sur les mots qu'ils
  partagent.

  Il le comble en plus, non à la place. La recherche par mots-clés trouve ce
  qui partage les mots et se tait sinon ; la recherche vectorielle classe tous
  les documents, toujours. Fusionner les deux classements garde le premier
  résultat du plein texte devant toute page que les mots n'ont pas trouvée, et
  emprunte la portée des vecteurs ; plus bas dans la liste, chaque jambe pèse
  autant que l'autre.

  Ce que ce niveau coûte vraiment n'est pas l'arithmétique ci-dessous. C'est le
  déploiement : des poids à télécharger et à charger, un processus à tenir
  chaud, et les vecteurs d'un document à recalculer quand il change — à côté
  d'un index plein texte que la base entretient déjà pour rien.

n3: |
  Répondre à une question à partir de vos propres documents : génération
  augmentée par récupération.

  Niveau N3. Le modèle ne connaît de votre manuel que ce que la consigne lui
  apporte. La récupération passe donc d'abord — N0, N1 ou N2 trouve les
  passages — et le modèle écrit la phrase à partir d'eux.

  Tout ce qui suit est de la plomberie, et la plomberie est là où sont les
  bogues : combien de passages envoyer et quelle longueur chacun peut faire,
  ce que le modèle a le droit de dire quand ils ne répondent pas, comment
  décoder une réponse qui n'est que probablement du JSON, et quoi faire quand
  il cite un passage que personne ne lui a envoyé.

  Ce dernier contrôle mérite ses lignes, et il vaut de savoir exactement ce
  qu'il achète : il attrape une source inventée. Il ne peut pas attraper une
  phrase inventée accrochée à une source réelle : il compare des
  identifiants, et ne lit jamais la phrase.

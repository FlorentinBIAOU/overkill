# Traductions de la docstring d'en-tête, servies sur les pages françaises.
# Une clé par niveau quand les deux langages disent la même chose, une clé par
# fichier — « n1.js » — quand ils diffèrent. Le code, lui, n'est pas traduit.

n0: |
  Lire une facture : le fichier structuré d'abord, la page seulement s'il n'y
  en a pas.

  Niveau N0. Aucun modèle, aucun jeu d'entraînement, aucun service.

  Depuis le 1er septembre 2026, toute entreprise en France doit pouvoir
  recevoir ses factures sous format électronique structuré, par l'intermédiaire
  d'une plateforme agréée, et le socle minimum de formats est UBL, CII et
  Factur-X, tous trois porteurs de la norme sémantique européenne EN 16931.
  Cela change l'ordre des opérations : quand la facture arrive structurée, ses
  champs ne sont pas extraits, ils sont lus, et la réponse est exacte.
  L'extraction est pour ce qui reste — un fournisseur hors de France, un ticket
  de caisse, une facture d'avant la réforme, l'arriéré.

  Ce fichier a donc deux portes et une règle : dire par quelle porte la réponse
  est passée. Un nombre lu dans du XML et un nombre lu sur une ligne de texte
  ne valent pas la même chose, et l'appelant doit pouvoir les distinguer.

  Sortir le XML d'un PDF Factur-X n'est pas le travail de ce fichier : c'est une
  pièce jointe dans le PDF, et n'importe quelle bibliothèque PDF la liste. Ce
  qui arrive ici, c'est le XML lui-même, ou le texte d'une page.

n1.js: |
  Étiqueter chaque ligne de la facture, puis lire la valeur dans la ligne.

  Niveau N1. N0 demandait « que dit cette ligne ». Celui-ci demande « où se
  trouve cette ligne, et à quoi ressemble-t-elle » : à quelle hauteur de page,
  quelle indentation, combien de mots, combien de montants, et si la valeur pend
  du côté droit.

  Ces traits survivent à un changement de fournisseur, ce que les libellés de N0
  ne font justement pas. L'entraînement tient en quelques dizaines de lignes
  étiquetées, et la régression logistique est assez courte pour être lue plutôt
  qu'importée.

n1.py: |
  Étiqueter chaque ligne de la facture, puis lire la valeur dans la ligne.

  Niveau N1. N0 demandait « que dit cette ligne ». Celui-ci demande « où se
  trouve cette ligne, et à quoi ressemble-t-elle » : à quelle hauteur de page,
  quelle indentation, combien de mots, combien de montants, et si la valeur pend
  du côté droit.

  Ces traits survivent à un changement de fournisseur, ce que les libellés de N0
  ne font justement pas. L'entraînement tient en quelques dizaines de lignes
  étiquetées, le modèle pèse quelques kilooctets, et rien ne se télécharge.


n3: |
  Demander à un modèle généraliste multimodal de lire la facture.

  Niveau N3. Le modèle reçoit une image de la page avec son texte, et l'image
  garde ce que le texte extrait a perdu : la colonne dans laquelle se trouve un
  montant.

  Notez ce que le code doit faire et que N0 ne faisait pas : borner la taille de
  ce qu'il envoie, réessayer après un échec, analyser une réponse qui n'est que
  probablement du JSON, et vérifier la forme de ce qui revient. Cette plomberie
  est le vrai coût de ce niveau, et c'est la part que vos tests doivent couvrir,
  parce que le modèle lui-même n'est pas testable.

  Une vérification, ici, ne porte pas sur la forme. Les trois montants sont
  demandés, et pas seulement celui qui est dû, pour que la somme dont la norme
  EN 16931 fait une règle — total TTC = total HT + TVA — puisse être recalculée
  sur ce que le modèle a écrit. Elle n'attrape rien de ce que le modèle se
  trompe systématiquement à faire, et elle attrape le chiffre lu sur la mauvaise
  ligne, qui est l'échec dont parle cette fiche.

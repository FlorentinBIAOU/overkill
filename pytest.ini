[pytest]
# L'arborescence de la section 10.2 du CDC impose des noms de test en
# « n0.test.py ». Ce n'est pas un nom de module Python valide, le point étant
# un séparateur de paquet. Le mode d'import importlib permet à pytest de
# charger le fichier sans lui inventer un nom de module.
python_files = *.test.py
python_functions = test_*
addopts = -q --no-header --import-mode=importlib
testpaths = content/snippets
norecursedirs = _harness
